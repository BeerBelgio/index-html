<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="color-scheme" content="light" />
  <title>Visual Lab — Tool</title>
  <link rel="icon" href="assets/favicon-vl.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tool-page.css" />
</head>
<body>
  <div id="standard-page">
    <header class="site-header">
      <div class="vl-mark" aria-label="Visual Lab">VL</div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="tool-name">
        <div class="hero-copy">
          <div class="meta-row" id="meta-row"></div>
          <div class="tool-heading-row">
            <h1 id="tool-name">Loading tool…</h1>
            <div class="tool-picker-wrap">
              <label for="tool-picker">Tool</label>
              <select id="tool-picker" aria-label="Choose a Visual Lab tool"></select>
            </div>
          </div>
          <p id="short-copy" class="short-copy"></p>
        </div>

        <div class="hero-actions">
          <a id="standalone-link" class="button button-secondary" href="#" target="_blank" rel="noopener">
            <span>OPEN CURRENT SETUP</span><span class="arrow-icon" aria-hidden="true"></span>
          </a>
          <a id="download-link" class="button button-primary" href="#" download>DOWNLOAD HTML</a>
        </div>
      </section>

      <section class="workbench" aria-label="Live tool preview and controls">
        <div class="preview-panel">
          <div class="panel-head"><span>LIVE PREVIEW</span></div>
          <div class="preview-stage" id="preview-stage">
            <iframe id="tool-frame" title="Visual tool live preview"></iframe>
          </div>
        </div>

        <aside class="controls-panel">
          <div class="panel-head controls-head">
            <span>CONTROLS</span>
            <button id="reset-button" class="text-button" type="button" disabled>RESET</button>
          </div>
          <div id="controls" class="controls-body" aria-live="polite">
            <p class="muted">Waiting for tool manifest…</p>
          </div>
        </aside>
      </section>

      <section class="content-stack">
        <article class="content-section">
          <p class="section-kicker">ABOUT</p>
          <p id="description" class="section-lead"></p>
        </article>

        <article class="content-section">
          <p class="section-kicker">PARAMETERS</p>
          <div id="parameters" class="parameters-list"></div>
        </article>

        <article class="content-section">
          <p class="section-kicker">LINEAGE</p>
          <div id="lineage"></div>
        </article>

        <article class="content-section">
          <p class="section-kicker">DEVELOPMENT</p>
          <div id="development"></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-signature">© 2026 BeerBelgio <span aria-hidden="true">·</span> FUN IS A SERIOUS THING.</div>
      <nav class="footer-links" aria-label="Visual Lab links">
        <a href="https://github.com/BeerBelgio/visual-lab" target="_blank" rel="noopener">
          <span>GITHUB</span><span class="arrow-icon" aria-hidden="true"></span>
        </a>
        <a class="hub-link" href="https://beerbelgio.github.io/" target="_blank" rel="noopener">
          <span>HUB</span><img src="assets/BeerBelgio-button.svg" alt="" aria-hidden="true" />
        </a>
      </nav>
    </footer>
  </div>

  <main id="standalone-page" class="standalone-page" hidden>
    <div class="standalone-stage" id="standalone-stage"></div>
  </main>

  <div id="fatal-error" class="fatal-error" hidden></div>
  <script src="assets/js/tool-page.js"></script>
</body>
</html>
