<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WebGL2 Gate A test</title>
<style>body{font:13px monospace;background:#efefef;margin:20px}#surface{width:320px;height:180px;position:relative;background:#ddd}#legacy{width:100%;height:100%}pre{white-space:pre-wrap}</style>
</head><body>
<h1>INDEX WebGL2 Lab — Gate A browser pixel oracle</h1>
<div id="surface"><canvas id="legacy" width="128" height="72"></canvas><div id="empty" style="display:none"></div></div>
<pre id="results" data-result="PENDING">Starting tests...</pre>
<script src="../assets/js/playground-webgl2-lab.js"></script>
<script>
(async function () {
 'use strict';
 const results = document.getElementById('results');
 const surface = document.getElementById('surface');
 const legacyCanvas = document.getElementById('legacy');
 const emptyElement = document.getElementById('empty');
 const W = 128, H = 72, lines = [];
 let pass = 0, fail = 0, lab = null;
 function report(name, success, detail='') {
   lines.push((success?'PASS ':'FAIL ')+name+(detail?' — '+detail:''));
   if(success)pass++;else fail++;
 }
 function check(name, fn) {
   try {fn(); report(name,true);}
   catch(e){report(name,false,String(e.message||e));}
 }
 function rgba(hex,a=1) {
   const n=parseInt(hex.slice(1),16);
   return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
 }
 async function generator(color,a=1,glProducer=false) {
   const c=document.createElement('canvas');c.width=W;c.height=H;
   if(glProducer) {
     const gl=c.getContext('webgl',{alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true});
     if(!gl)throw Error('WebGL1 fixture unavailable');
     const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255);
     gl.viewport(0,0,W,H);gl.clearColor(...rgb,a);gl.clear(gl.COLOR_BUFFER_BIT);
   } else {
     const ctx=c.getContext('2d',{alpha:true});
     ctx.fillStyle=rgba(color,a);ctx.fillRect(0,0,W,H);
   }
   const bitmap=await createImageBitmap(c);
   return {role:'generator',bitmap,manifest:{name:'fixture'},loading:false,visible:true,opacity:1,blend:'normal'};
 }
 function sample(canvas) {
   const c=document.createElement('canvas');c.width=W;c.height=H;
   const ctx=c.getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,W,H);ctx.drawImage(canvas,0,0,W,H);
   return Array.from(ctx.getImageData(Math.floor(W/2),Math.floor(H/2),1,1).data);
 }
 function expected(layers) {
   const c=document.createElement('canvas');c.width=W;c.height=H;
   const ctx=c.getContext('2d',{alpha:true});
   for(const l of layers){
     if(!l.visible||!l.manifest||l.loading||l.opacity<=0||l.role!=='generator')continue;
     ctx.save();ctx.globalAlpha=l.opacity;ctx.globalCompositeOperation={
       normal:'source-over',add:'lighter',multiply:'multiply',screen:'screen'
     }[l.blend];ctx.drawImage(l.bitmap,0,0,W,H);ctx.restore();
   }
   return sample(c);
 }
 function compare(name,layers,tolerance=6) {
   lab.render(layers,W,H);
   const actual=sample(document.getElementById('pg-gpu-lab'));
   const want=expected(layers);
   const max=Math.max(...want.map((x,i)=>Math.abs(x-actual[i])));
   report(name,max<=tolerance,'GPU='+actual.join(',')+' Canvas2D='+want.join(',')+' Δ='+max+' tol='+tolerance);
 }
 try {
   lab=window.IndexWebGL2Lab.create({surface,legacyCanvas,emptyElement});
   check('single WebGL2 context + max 2048',()=>{const s=lab.getStats();if(s.contexts!==1||s.maxDimension!==2048)throw Error(JSON.stringify(s));});
   const red=await generator('#ee3366',0.65);
   const blue=await generator('#2277ff',0.75);
   const green=await generator('#33dd66',0.5);
   const amber=await generator('#ffaa22',0.5);
   const cyan=await generator('#11ccdd',0.5,true);
   const images=[red,blue,green,amber,cyan];
   compare('solid single partial alpha',[red]);
   for(const opacity of [1,.5,0,1]){
     blue.opacity=opacity;
     compare('alpha cycle '+Math.round(opacity*100)+'%',[red,blue]);
   }
   blue.opacity=.5;
   for(const blend of ['normal','add','multiply','screen']){
     blue.blend=blend;compare('blend '+blend+' partial alpha',[red,blue]);
   }
   blue.blend='normal';blue.opacity=1;
   compare('five mixed Canvas2D/WebGL1 source layers',images);
   green.visible=false;compare('hide layer 3',images);
   green.visible=true;compare('show layer 3',images);
   compare('clear layer 2 without other changes',[red,green,amber,cyan]);
   const fx={role:'effect-webgl2',manifest:window.IndexWebGL2Lab.channelRelayManifest(),
     visible:true,loading:false,opacity:1,blend:'normal',state:{shift_px:0,strength:0}};
   lab.render([red,fx],W,H);
   const noShift=sample(document.getElementById('pg-gpu-lab'));
   check('synthetic FX shift=0 no change',()=>{
     const want=expected([red]);const diff=Math.max(...want.map((x,i)=>Math.abs(x-noShift[i])));
     if(diff>6)throw Error('GPU='+noShift.join(',')+' want='+want.join(',')+' diff='+diff);
   });
   lab.render([red,blue,fx],W,H);
   fx.state.shift_px=11;fx.state.strength=1;
   lab.render([red,blue,fx],W,H);
   check('stateless Channel Relay FX renders',()=>{
     const s=lab.getStats();if(s.textureBytesEstimate!==W*H*4*4)throw Error('texture estimate wrong');
   });
   check('unsupported legacy FX rejected visibly',()=>{
     try{lab.render([red,{role:'effect',visible:true,opacity:1,manifest:{},loading:false}],W,H);throw Error('not rejected');}
     catch(e){if(!String(e.message).includes('Unsupported fragment-webgl1'))throw e;}
   });
   lab.render([red],W*2,H*2);
   check('resize reallocates GPU targets',()=>{
     const s=lab.getStats();if(s.width!==W*2||s.height!==H*2)throw Error(JSON.stringify(s));
   });
   check('destroy restores legacy canvas',()=>{
     lab.dispose();if(legacyCanvas.style.visibility==='hidden')throw Error('legacy remains hidden');
     if(document.getElementById('pg-gpu-lab'))throw Error('GPU canvas leaked');
   });
   for(const l of images)l.bitmap.close();
 } catch(e) {report('fixture initialization/runtime',false,String(e.stack||e)); if(lab)lab.dispose();}
 results.textContent=lines.join('\n')+'\nTOTAL '+pass+' PASS / '+fail+' FAIL';
 results.dataset.result=fail===0?'PASS':'FAIL';
 document.title='GATE_A_'+(fail===0?'PASS':'FAIL');
})();
</script>
</body></html>
