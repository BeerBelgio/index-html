<!doctype html><html lang="en"><head><meta charset="utf-8"><title>INDEX normal Playground WebGL2 smoke</title>
<style>body{font:13px monospace}iframe{width:1100px;height:850px;border:0}pre{white-space:pre-wrap}</style></head>
<body><h1>INDEX normal Playground WebGL2 — browser integration</h1>
<iframe id="app" src="../playground.html" title="WebGL2 demo"></iframe>
<pre id="results" data-result="PENDING">Starting...</pre>
<script>
(async()=>{
 'use strict';
 const iframe=document.getElementById('app'),out=document.getElementById('results');
 const lines=[];let pass=0,fail=0;
 function check(name,ok,details=''){
  const success=!!ok;lines.push((success?'PASS ':'FAIL ')+name+(success?'':': '+details));
  if(success)pass++;else fail++;
 }
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 async function until(fn,limit=20000){const start=performance.now();
   while(performance.now()-start<limit){
     try{if(fn())return true;}catch(e){}
     await sleep(120);
   }
   return false;
 }
 try{
   await new Promise((resolve,reject)=>{
     iframe.addEventListener('load',resolve,{once:true});
     iframe.addEventListener('error',reject,{once:true});
   });
   const d=iframe.contentDocument;
   const ready=await until(()=>!!d.defaultView.IndexWebGL2Lab,12000);
   check('normal Playground loads WebGL2 capability without mode UI',ready);
   check('GPU context is deferred until a tool loads',!d.getElementById('pg-gpu-lab'));
   check('normal page preserves five layers',d.querySelectorAll('.pg-layer-card').length===5);
   const cards=()=>[...d.querySelectorAll('.pg-layer-card')];
   const firstPick=cards()[0]?.querySelector('.pg-layer-pick');
   const firstEye=cards()[0]?.querySelector('.pg-layer-visibility');
   const firstClear=cards()[0]?.querySelector('.pg-layer-clear');
   const firstSlider=cards()[0]?.querySelector('.pg-opacity-slider');
   const rect=el=>el.getBoundingClientRect();
   check('selection button covers label and tool name',!!firstPick &&
     !!firstPick.querySelector('.pg-layer-number') && !!firstPick.querySelector('.pg-layer-name'));
   check('selection button extends to a practical hit area',!!firstPick &&
     rect(firstPick).width>=45 && rect(firstPick).height>=60,
     firstPick?.getBoundingClientRect().toJSON?.().height);
   check('selection ends before ON and CLEAR',!!firstPick && !!firstEye && !!firstClear &&
     rect(firstPick).right <= rect(firstEye).left+1 &&
     rect(firstPick).right <= rect(firstClear).left+1);
   check('selection ends above opacity slider',!!firstPick && !!firstSlider &&
     rect(firstPick).bottom <= rect(firstSlider).top+1);
   check('selection button remains transparent',!!firstPick &&
     ['rgba(0, 0, 0, 0)','transparent'].includes(d.defaultView.getComputedStyle(firstPick).backgroundColor));
   // Hit the lower-left area (outside the two-character layer identifier).
   const secondPick=cards()[1].querySelector('.pg-layer-pick');
   const bounds=rect(secondPick);
   const hit=d.elementFromPoint(bounds.left+Math.min(12,bounds.width/2),bounds.bottom-8);
   check('lower portion of the selection rectangle receives the click',hit===secondPick||secondPick.contains(hit));
   hit?.click();
   check('clicking expanded hit target selects L2',cards()[1].classList.contains('is-active') &&
     !cards()[0].classList.contains('is-active'));
   check('selection leaves visibility and opacity unchanged',cards()[1].querySelector('.pg-layer-visibility').textContent==='ON' &&
     cards()[1].querySelector('.pg-opacity-slider').value==='100');
   cards()[1].querySelector('.pg-layer-visibility').click();
   check('ON/OFF does not switch selection',cards()[1].classList.contains('is-active') &&
     cards()[1].querySelector('.pg-layer-visibility').textContent==='OFF');
   cards()[1].querySelector('.pg-layer-visibility').click();
   check('toggle ON restores state without selecting another layer',cards()[1].classList.contains('is-active') &&
     cards()[1].querySelector('.pg-layer-visibility').textContent==='ON');
   cards()[0].querySelector('.pg-layer-pick').focus();
   d.defaultView.document.activeElement.dispatchEvent(new d.defaultView.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
   // Activation from keyboard is also covered by the native button semantics.
   cards()[0].querySelector('.pg-layer-pick').click();
   check('original layer can be selected again',cards()[0].classList.contains('is-active'));
   check('no demo CTA or forced sample content',!d.getElementById('pg-webgl2-entry') &&
     ![...d.querySelectorAll('button')].some(b=>b.textContent.includes('CHANNEL RELAY [GPU LAB]')) &&
     d.querySelectorAll('.pg-layer-frame').length===0);
   check('original CHOOSE A FILE remains available',!!d.querySelector('#pg-file[accept*=".html"]'));
   check('catalogue tool loading remains available',!!d.querySelector('#pg-select') && !!d.querySelector('#pg-load'));
   check('default Canvas2D fallback canvas retained',!!d.querySelector('#pg-composite'));
   check('no initial GPU error',!d.getElementById('pg-status')?.classList.contains('pg-status-error'),d.getElementById('pg-status')?.textContent);
 }catch(e){check('demo smoke infrastructure',false,String(e.stack||e));}
 out.textContent=lines.join('\n')+'\nTOTAL '+pass+' PASS / '+fail+' FAIL';
 out.dataset.result=fail===0?'PASS':'FAIL';
 document.title='NORMAL_WEBGL2_PLAYGROUND_'+(fail===0?'PASS':'FAIL');
})();
</script></body></html>
