<!doctype html><html lang="en"><head><meta charset="utf-8"><title>INDEX WebGL2 local FX import integration</title>
<style>body{font:13px monospace}iframe{width:1050px;height:850px;border:0}pre{white-space:pre-wrap}</style></head>
<body><h1>INDEX local FX HTML import and instance-isolation test</h1>
<iframe id="app" title="GPU Playground" src="../playground.html"></iframe>
<pre id="results" data-result="PENDING">Starting...</pre>
<script>
(async()=>{
 const out=document.getElementById('results'),frame=document.getElementById('app');
 const lines=[];let pass=0,fail=0;
 const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
 async function until(fn,limit=12000){const began=performance.now();while(performance.now()-began<limit){try{if(fn())return true;}catch(e){}await sleep(100);}return false;}
 function check(name,condition,details=''){const ok=!!condition;lines.push((ok?'PASS ':'FAIL ')+name+(ok?'':' '+details));if(ok)pass++;else fail++;}
 try{
  await new Promise((ok,bad)=>{frame.addEventListener('load',ok,{once:true});frame.addEventListener('error',bad,{once:true});});
  const d=frame.contentDocument;
  check('GPU composer loads',await until(()=>!!d.getElementById('pg-gpu-lab')));
  const localTool=`<!doctype html><html><head><title>Solid Color Fixture</title></head><body><canvas id="sketch-canvas"></canvas><script>
    window.INDEX_TOOL={schemaVersion:1,role:'generator',name:'Solid Color Fixture',params:[],colors:[]};
    window.indexResize=(w,h)=>{const c=document.querySelector('canvas');c.width=w;c.height=h;};
    window.indexDraw=()=>{const c=document.querySelector('canvas');const ctx=c.getContext('2d');ctx.fillStyle='#dd2266';ctx.fillRect(0,0,c.width,c.height);};
  <\/script></body></html>`;
  function importHTML(fileName,source){
    const input=d.getElementById('pg-file'),transfer=new DataTransfer();
    transfer.items.add(new File([source],fileName,{type:'text/html'}));
    input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));
  }
  importHTML('local-generator.html',localTool);
  const first=await until(()=>d.querySelector('.pg-layer-card')?.textContent.includes('Solid Color Fixture')
    && d.querySelector('#pg-log')?.textContent.includes('first frame displayed'),18000);
  check('locally imported generator produces first frame',first,d.querySelector('#pg-status')?.textContent+' log='+d.querySelector('#pg-log')?.textContent.slice(-1500)+' rack='+d.querySelector('.pg-layer-card')?.textContent);
  const fxSource=await (await fetch('fixtures/original-feedback-history.html')).text();
  d.querySelectorAll('.pg-layer-pick')[1].click();
  importHTML('original-feedback-history.html',fxSource);
  const fx1=await until(()=>d.querySelector('#pg-title')?.textContent.includes('Original Feedback History')
    && !d.getElementById('pg-reset-fx-history')?.hidden,12000);
  check('import external two-pass feedback FX into L2',fx1,d.querySelector('#pg-status')?.textContent);
  check('imported FX exposes parameters',d.querySelectorAll('#pg-params .pg-control').length===2);
  const reset=d.getElementById('pg-reset-fx-history');
  const before=d.querySelector('#pg-params input[type="range"]')?.value;
  reset?.click();
  check('RESET HISTORY preserves parameters',!!before&&d.querySelector('#pg-params input[type="range"]')?.value===before);
  d.querySelectorAll('.pg-layer-pick')[2].click();
  importHTML('second-feedback.html',fxSource);
  const fx2=await until(()=>[...d.querySelectorAll('.pg-layer-card')].slice(1,3).every(c=>c.textContent.includes('Original Feedback History'))
    && d.querySelectorAll('.pg-layer-frame').length===3,12000);
  check('same external FX imported to independent L3',fx2,d.querySelector('#pg-status')?.textContent);
  d.querySelectorAll('.pg-layer-card')[1].querySelector('.pg-layer-clear').click();
  check('CLEAR L2 leaves L3 FX intact',d.querySelectorAll('.pg-layer-card')[2].textContent.includes('Original Feedback History')
    && d.querySelectorAll('.pg-layer-frame').length===2);
  check('GPU still active with remaining instance',d.getElementById('pg-gpu-lab')?.style.display!=='none'
    && !d.getElementById('pg-status')?.classList.contains('pg-status-error'),d.getElementById('pg-status')?.textContent);
 }catch(e){check('test infrastructure',false,String(e.stack||e));}
 out.textContent=lines.join('\n')+'\nTOTAL '+pass+' PASS / '+fail+' FAIL';
 out.dataset.result=fail===0?'PASS':'FAIL';
 document.title='LOCAL_WEBGL2_FX_'+(fail===0?'PASS':'FAIL');
})();
</script></body></html>
