<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fractured Mask v1.4</title>
  <style>
    html, body { margin: 0; background: #fff; overflow: hidden; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
<canvas id="sketch-canvas"></canvas>
<script>
window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "Fractured Mask v1.4",
  params: [
    { key: "layout",                label: "Layout",                min: 0, max: 2,   step: 1, default: 0  },
    { key: "seed",                  label: "Seed",                  min: 0, max: 100, step: 1, default: 18 },
    { key: "density",               label: "Density",               min: 0, max: 100, step: 1, default: 46 },
    { key: "cut_asymmetry",         label: "Cut Asymmetry",         min: 0, max: 100, step: 1, default: 42 },
    { key: "coverage_distribution", label: "Coverage Distribution", min: 0, max: 100, step: 1, default: 74 },
    { key: "fragment_fill",         label: "Fragment Fill",         min: 0, max: 100, step: 1, default: 100 },
    { key: "fill_opacity",          label: "Fill Opacity",          min: 0, max: 100, step: 1, default: 100 }
  ],
  colors: [
    { key: "fill_color", label: "Fill Color", default: "#1c1713" }
  ],
  audio: [
      "layout", "seed", "density", "cut_asymmetry", "coverage_distribution", "fragment_fill",
      "fill_opacity"
    ]
};

const canvas = document.getElementById('sketch-canvas');
const ctx = canvas.getContext('2d', { alpha: true });
const maskCanvas = document.createElement('canvas');
const mctx = maskCanvas.getContext('2d', { alpha: true });

const toolDefaults = Object.create(null);
for (const item of window.SKETCH_TOOL.params.concat(window.SKETCH_TOOL.colors)) {
  toolDefaults[item.key] = item.default;
}
function readVal(obj, key, fallback){
  if (Object.prototype.hasOwnProperty.call(toolDefaults, key)) fallback = toolDefaults[key];
  const value = (obj && Object.prototype.hasOwnProperty.call(obj, key)) ? obj[key] : undefined;
  if (value === undefined || value === null) return fallback;
  if (typeof fallback === 'number') {
    if (typeof value !== 'number' && typeof value !== 'string') return fallback;
    if (typeof value === 'string' && value.trim() === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
  if (typeof fallback === 'string' && fallback.charAt(0) === '#') {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }
  return value;
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function clamp01(v){ return clamp(v,0,1); }
function fract(v){ return v - Math.floor(v); }
function hash(n){ return fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453); }
function hexToRgb(hex){
  const h = typeof hex === 'string' && hex.charAt(0) === '#' ? hex.slice(1) : '';
  if (h.length !== 6) return [255,255,255];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgba(rgb,a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

window.sketchResize = function(width, height){
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    maskCanvas.width = width;
    maskCanvas.height = height;
  }
};

function layoutCounts(layout, density, aspect){
  const base = 2 + Math.floor(density * 10);
  let c = base, r = base;
  if (layout === 1) { c = 4 + Math.floor(density * 18); r = 2 + Math.floor(density * 4); }
  if (layout === 2) { r = 4 + Math.floor(density * 18); c = 2 + Math.floor(density * 4); }
  if (layout === 0) {
    if (aspect > 1.15) c += Math.floor((aspect - 1) * 2);
    if (aspect < 0.85) r += Math.floor((1 / Math.max(aspect, 0.2) - 1) * 2);
  }
  return [Math.max(1,c), Math.max(1,r)];
}

function weightedCuts(count, seed, asym, bias){
  const cuts = new Array(count + 1);
  cuts[0] = 0;
  cuts[count] = 1;
  if (count <= 1) return cuts;

  // Positive interval weights guarantee strictly ordered cuts.
  // Asymmetry controls the dynamic range rather than unconstrained node jitter.
  const weights = [];
  let total = 0;

  for (let i = 0; i < count; i++) {
    const h1 = Math.max(0.0001, hash(seed + i * 17.13));
    const h2 = Math.max(0.0001, hash(seed * 1.71 + i * 31.77 + 9.13));
    const mixed = Math.pow(h1, 0.55) * 0.72 + Math.pow(h2, 2.4) * 0.28;

    // At asym=0 all cells are equal.
    // At asym=1 weights span a very wide range, producing tiny + huge neighbours.
    const exponent = 1 + asym * 5.5;
    let w = Math.pow(Math.max(0.02, mixed), exponent);

    // Gentle directional bias keeps the three Layout modes visually distinct.
    if (bias !== 0) {
      const t = count <= 1 ? 0.5 : i / (count - 1);
      const directional = 0.38 + 1.62 * (bias > 0 ? t : (1 - t));
      w *= Math.pow(directional, Math.abs(bias) * asym * 1.4);
    }

    // Never allow a mathematically zero-width cell.
    w = Math.max(0.003, w);
    weights.push(w);
    total += w;
  }

  let acc = 0;
  for (let i = 1; i < count; i++) {
    acc += weights[i - 1] / total;
    cuts[i] = acc;
  }

  return cuts;
}

function makeGrid(cols, rows, layout, seed, asym){
  const pts = [];
  const s = seed * 137.731 + layout * 907.13;

  // X cuts are globally ordered, but highly non-uniform.
  const xBias = layout === 1 ? 0.75 : layout === 2 ? -0.15 : 0;
  const xCuts = weightedCuts(cols, s + 11.7, asym, xBias);

  // Each vertical cut gets its own ordered Y distribution.
  // Because y remains ordered at both ends of every cell strip,
  // polygons can become extremely skewed without self-intersection.
  const yColumns = [];
  for (let x = 0; x <= cols; x++) {
    const colBias = layout === 2 ? 0.72 : layout === 1 ? -0.12 : 0;
    const variation = asym * (0.45 + 0.55 * hash(s + x * 43.19));
    yColumns[x] = weightedCuts(
      rows,
      s + 1000 + x * 79.31,
      variation,
      colBias
    );
  }

  // Blend the per-column Y structures toward a common ordered backbone
  // at lower asymmetry; at high asymmetry each column can diverge strongly.
  const yBackbone = weightedCuts(
    rows,
    s + 5000.5,
    asym,
    layout === 2 ? 0.55 : 0
  );

  const columnFreedom = Math.pow(asym, 1.18);

  for (let y = 0; y <= rows; y++) {
    pts[y] = [];
    for (let x = 0; x <= cols; x++) {
      const nx = xCuts[x];
      const ny = y === 0 ? 0
        : y === rows ? 1
        : yBackbone[y] * (1 - columnFreedom) + yColumns[x][y] * columnFreedom;

      pts[y][x] = [nx, clamp01(ny)];
    }
  }

  return pts;
}

function polygonCentroid(poly){
  let x = 0, y = 0;
  for (let i = 0; i < poly.length; i++) { x += poly[i][0]; y += poly[i][1]; }
  return [x / poly.length, y / poly.length];
}

function drawPoly(target, poly, fillStyle){
  target.beginPath();
  target.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) target.lineTo(poly[i][0], poly[i][1]);
  target.closePath();
  target.fillStyle = fillStyle;
  target.fill();
}

function expandPolyPixels(poly, px){
  if (px <= 0.0001) return poly;
  const c = polygonCentroid(poly);
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const dx = poly[i][0] - c[0];
    const dy = poly[i][1] - c[1];
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const scale = (len + px) / len;
    out.push([c[0] + dx * scale, c[1] + dy * scale]);
  }
  return out;
}

function shrinkPoly(poly, t){
  const c = polygonCentroid(poly);
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    out.push([
      c[0] + (poly[i][0] - c[0]) * t,
      c[1] + (poly[i][1] - c[1]) * t
    ]);
  }
  return out;
}

function areaMetric(cx, cy, w, h, layout, seed){
  const nx = cx / Math.max(w, 1);
  const ny = cy / Math.max(h, 1);
  const dx = nx - 0.5;
  const dy = ny - 0.5;
  const radial = Math.sqrt(dx * dx + dy * dy) / 0.7071;
  if (layout === 1) return nx;
  if (layout === 2) return ny;
  return hash(seed * 17.317 + Math.floor(nx * 91) * 3.1 + Math.floor(ny * 113) * 5.7 + radial * 11.3);
}

window.sketchDraw = function(state){
  const w = canvas.width;
  const h = canvas.height;
  if (w < 1 || h < 1) return;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, w, h);

  const layout = clamp(Math.round(readVal(state, 'layout')), 0, 2);
  const seedRaw = clamp(readVal(state, 'seed'), 0, 100);
  const seed = Math.round(seedRaw); // discrete + compact, less visually repetitive across the sweep
  const density = clamp01(readVal(state, 'density') / 100);
  const cutAsym = clamp01(readVal(state, 'cut_asymmetry') / 100);
  const coverageDistribution = clamp01(readVal(state, 'coverage_distribution') / 100);
  const fragmentFill = clamp01(readVal(state, 'fragment_fill') / 100);
  const fillOpacity = clamp01(readVal(state, 'fill_opacity') / 100);
  const fillRgb = hexToRgb(readVal(state, 'fill_color'));
  const fillStyle = rgba(fillRgb, 1);

  mctx.clearRect(0, 0, w, h);
  mctx.globalAlpha = 1;
  mctx.globalCompositeOperation = 'source-over';

  const aspect = w / Math.max(h, 1);
  const [cols, rows] = layoutCounts(layout, density, aspect);
  const grid = makeGrid(cols, rows, layout, seed, Math.pow(cutAsym, 0.72));
  const scaleT = Math.sqrt(fragmentFill); // true per-fragment area control

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const p0 = [grid[y][x][0] * w,     grid[y][x][1] * h];
      const p1 = [grid[y][x+1][0] * w,   grid[y][x+1][1] * h];
      const p2 = [grid[y+1][x+1][0] * w, grid[y+1][x+1][1] * h];
      const p3 = [grid[y+1][x][0] * w,   grid[y+1][x][1] * h];
      const poly = [p0,p1,p2,p3];
      const c = polygonCentroid(poly);
      const metric = areaMetric(c[0], c[1], w, h, layout, seed + (y * cols + x + 1) * 0.121);

      let active = 0;
      if (coverageDistribution >= 0.999) active = 1;
      else if (coverageDistribution <= 0.001) active = 0;
      else active = (metric <= coverageDistribution) ? 1 : 0;

      if (!active || scaleT <= 0.0001 || fillOpacity <= 0.0001) continue;
      let inner = shrinkPoly(poly, scaleT);

      // Slightly enlarge fragments to cover AA seams between neighbouring cells.
      const seamBlend = clamp01((fragmentFill - 0.94) / 0.06);
      if (seamBlend > 0) {
        inner = expandPolyPixels(inner, 2.0 * seamBlend);
      }

      drawPoly(mctx, inner, fillStyle);
    }
  }

  if (fillOpacity > 0.0001) {
    ctx.globalAlpha = fillOpacity;
    ctx.drawImage(maskCanvas, 0, 0);
    ctx.globalAlpha = 1;
  }
};
</script>
<script>
(function localPreview(){
  if (window.parent !== window) return;
  const manifest = window.SKETCH_TOOL;
  const state = { time: 0 };
  for (const p of manifest.params) state[p.key] = p.default;
  for (const c of manifest.colors) state[c.key] = c.default;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    window.sketchResize(
      Math.max(1, Math.floor(width * dpr)),
      Math.max(1, Math.floor(height * dpr))
    );
  }
  fit();
  window.addEventListener('resize', fit);
  let last = performance.now();
  function tick(now){
    state.time += Math.min(0.05, (now - last) / 1000);
    last = now;
    try { window.sketchDraw(state); } catch(e) { console.error('[sketch] draw threw:', e); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
