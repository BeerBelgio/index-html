<body>
  <canvas id="sketch-canvas"></canvas>

  <script>
    window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "Electrostatic Field v1.0",
  params: [
    { key: "system_shape", label: "System Shape", min: 0, max: 3, step: 1, default: 3 },
    { key: "density", label: "Density", min: 6, max: 120, step: 1, default: 90 },
    { key: "scale", label: "Scale", min: 40, max: 300, step: 1, default: 275 },
    { key: "flow", label: "Flow", min: 0, max: 300, step: 1, default: 58 },
    { key: "warp", label: "Warp", min: 0, max: 100, step: 1, default: 42 },
    { key: "pole_force", label: "Pole Force", min: 0, max: 100, step: 1, default: 52 },
    { key: "pole_count", label: "Pole Count", min: 3, max: 96, step: 1, default: 24 },
    { key: "path_length", label: "Path Length", min: 10, max: 100, step: 1, default: 56 },
    { key: "spread", label: "Spread", min: 0, max: 200, step: 1, default: 44 },
    { key: "line_width", label: "Line Width", min: 0.5, max: 6, step: 0.1, default: 1.2 },
    { key: "accent", label: "Accent", min: 0, max: 100, step: 1, default: 18 },
    { key: "motion_bpm", label: "Motion BPM", min: 30, max: 180, step: 1, default: 76 }
  ],
  colors: [
    { key: "line_color", label: "Line Color", default: "#E8DDC8" },
    { key: "accent_color", label: "Accent Color", default: "#EC6B2D" }
  ],
  audio: [
    "density", "scale", "flow", "warp",
    "pole_force", "pole_count", "path_length", "spread",
    "line_width", "accent"
  ]
};

    const canvas = document.getElementById("sketch-canvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function clamp01(v) { return clamp(v, 0, 1); }
    function fract(v) { return v - Math.floor(v); }

    function hash1(n) {
      return fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
    }

    function hash2(a, b) {
      return fract(Math.sin(a * 127.1 + b * 311.7 + 91.73) * 43758.5453123);
    }

    function readVal(obj, key, fallback) {
      return (obj &&
        Object.prototype.hasOwnProperty.call(obj, key) &&
        obj[key] !== undefined &&
        obj[key] !== null)
        ? obj[key]
        : fallback;
    }

    function rotateLocal(x, y, angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return { x: x * c - y * s, y: x * s + y * c };
    }

    function dist2(ax, ay, bx, by) {
      const dx = ax - bx;
      const dy = ay - by;
      return dx * dx + dy * dy;
    }

    
function indexColorOpacity(hostContext, key){
  if (!hostContext || !hostContext.colorOpacity) return 1;
  const value = Number(hostContext.colorOpacity[key]);
  return Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : 1;
}

window.sketchResize = function(width, height) {
      width = Math.max(1, Math.floor(width));
      height = Math.max(1, Math.floor(height));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    function getMode(state) {
      return Math.round(clamp(readVal(state, "system_shape", 3), 0, 3));
    }

    function getPoleCount(state) {
      return Math.round(clamp(readVal(state, "pole_count", 24), 3, 96));
    }

    function getPoles(radius, phase, mode, state) {
      const count = getPoleCount(state);
      const P = [];

      // As the pole count increases, each pole becomes more local and more spatially dispersed.
      const countT = (count - 3) / 93;
      const baseInfluence = 0.17 - countT * 0.10; // broad -> local
      const scatterGain = 0.10 + countT * 0.52;   // centre-biased -> widely dispersed

      if (mode === 1) {
        // Parallel: poles spread across the whole width and across several staggered rows.
        const rows = count > 72 ? 4 : count > 36 ? 3 : count > 12 ? 2 : 1;
        for (let i = 0; i < count; i++) {
          const t = count <= 1 ? 0.5 : i / (count - 1);
          const row = i % rows;

          const xBase = (t - 0.5) * radius * 1.56;
          const rowY = rows === 1 ? 0 : (row - (rows - 1) * 0.5) * radius * 0.28;
          const randX = (hash1(i * 3.17 + 1.2) - 0.5) * radius * 0.58 * scatterGain;
          const randY = (hash1(i * 5.71 + 3.6) - 0.5) * radius * 0.78 * scatterGain;
          const waveY = Math.sin(phase * (0.18 + i * 0.003) + i * 0.63) * radius * 0.12;

          P.push({
            x: xBase + randX,
            y: rowY + randY + waveY,
            sign: i % 2 === 0 ? 1 : -1,
            influence: Math.max(0.045, baseInfluence * (0.88 + (i % 4) * 0.05))
          });
        }
        return P;
      }

      if (mode === 2) {
        // Converging: poles distributed on several rings + random off-axis scatter.
        const rings = count > 72 ? 5 : count > 36 ? 4 : count > 15 ? 3 : 2;
        let emitted = 0;
        for (let r = 0; r < rings; r++) {
          const ringT = rings === 1 ? 0 : r / (rings - 1);
          const ringRadius = radius * (0.08 + ringT * 0.46);
          const ringCount = Math.round(count / rings + (r < (count % rings) ? 1 : 0));

          for (let j = 0; j < ringCount && emitted < count; j++, emitted++) {
            const a = (j / ringCount) * Math.PI * 2 + r * 0.29 + emitted * 0.017;
            const randR = radius * scatterGain * (hash1(emitted * 4.91 + 2.8) - 0.5) * 0.44;
            const randA = (hash1(emitted * 7.13 + 8.1) - 0.5) * 0.9;
            const rr = Math.max(radius * 0.04, ringRadius + randR);
            const aa = a + randA;

            P.push({
              x: Math.cos(aa + phase * (0.04 + emitted * 0.0012)) * rr,
              y: Math.sin(aa - phase * (0.04 + emitted * 0.0010)) * rr,
              sign: emitted % 2 === 0 ? 1 : -1,
              influence: Math.max(0.045, baseInfluence * (0.84 + (emitted % 3) * 0.07))
            });
          }
        }
        return P;
      }

      if (mode === 3) {
        // Resonance: lissajous-like structure, but increasingly broken apart as count rises.
        for (let i = 0; i < count; i++) {
          const t = i / count;
          const a = t * Math.PI * 2;
          const xBase = Math.sin(a * 3.0 + phase * 0.03) * radius * 0.36
                      + Math.sin(a * 7.0 + i * 0.13) * radius * 0.08;
          const yBase = Math.sin(a * 2.0 - phase * 0.025) * radius * 0.30
                      + Math.cos(a * 5.0 + i * 0.09) * radius * 0.10;
          const randX = (hash1(i * 2.73 + 7.4) - 0.5) * radius * 0.74 * scatterGain;
          const randY = (hash1(i * 4.17 + 5.1) - 0.5) * radius * 0.74 * scatterGain;

          P.push({
            x: xBase + randX,
            y: yBase + randY,
            sign: i % 2 === 0 ? 1 : -1,
            influence: Math.max(0.045, baseInfluence * (0.82 + (i % 5) * 0.05))
          });
        }
        return P;
      }

      // Concentric / orbital: several rings, progressively less orderly as count grows.
      const rings = count > 72 ? 5 : count > 36 ? 4 : count > 15 ? 3 : 2;
      let emitted = 0;
      for (let r = 0; r < rings; r++) {
        const ringT = rings === 1 ? 0 : r / (rings - 1);
        const ringRadius = radius * (0.12 + ringT * 0.42);
        const ringCount = Math.round(count / rings + (r < (count % rings) ? 1 : 0));

        for (let j = 0; j < ringCount && emitted < count; j++, emitted++) {
          const a = (j / ringCount) * Math.PI * 2 + r * 0.17;
          const randR = radius * scatterGain * (hash1(emitted * 3.91 + 0.8) - 0.5) * 0.34;
          const randA = (hash1(emitted * 6.33 + 9.2) - 0.5) * 0.7;
          const rr = Math.max(radius * 0.04, ringRadius + randR);
          const driftA = phase * (j % 2 === 0 ? 0.05 : -0.04);

          P.push({
            x: Math.cos(a + randA + driftA + emitted * 0.008) * rr,
            y: Math.sin(a - randA - driftA * 0.82 + emitted * 0.008) * rr,
            sign: emitted % 2 === 0 ? 1 : -1,
            influence: Math.max(0.045, baseInfluence * (0.86 + (emitted % 4) * 0.05))
          });
        }
      }

      return P;
    }

    function makeEmitter(index, count, radius, spreadNorm, phase, mode) {
      const n = Math.max(1, count - 1);
      const spreadExtra = Math.max(0, spreadNorm - 1.0);

      if (mode === 1) {
        // Parallel lines: emitters arranged in broad bands, mostly off the left side.
        const t = count <= 1 ? 0.5 : index / n;
        const yBand = (t - 0.5) * radius * 1.62;
        const yWave = Math.sin(t * Math.PI * 4 + phase * 0.27) * radius * 0.10 * spreadNorm;
        const yJitter = (hash1(index * 5.17 + 2.1) - 0.5) * radius * (0.42 * spreadNorm + 0.18 * spreadExtra);
        const x = -radius * (0.96 + hash1(index * 7.13 + 3.4) * (0.18 + 0.18 * spreadNorm + 0.10 * spreadExtra));
        const y = yBand + yWave + yJitter;
        return { x, y, family: Math.floor(t * 6), id: index };
      }

      if (mode === 2) {
        // Converging lines: emitters on the perimeter, biased toward opposing sides.
        const side = index % 2 === 0 ? -1 : 1;
        const t = Math.floor(index / 2) / Math.max(1, Math.ceil(count / 2) - 1);
        const y = (t - 0.5) * radius * 1.50 + Math.sin(t * Math.PI * 3 + phase * 0.25) * radius * 0.08 * spreadNorm;
        const x = side * radius * (0.88 + 0.10 * hash1(index * 4.77 + 8.1) + (0.16 * spreadNorm + 0.14 * spreadExtra) * hash1(index * 9.3 + 1.2));
        return { x, y, family: side > 0 ? 1 : 0, id: index };
      }

      if (mode === 3) {
        // Resonance field: emitters placed on harmonic bands / intervals.
        const ratios = [1.0, 1.25, 1.5, 2.0, 0.75];
        const rIndex = index % ratios.length;
        const layer = Math.floor(index / ratios.length);
        const layerT = layer / Math.max(1, Math.ceil(count / ratios.length) - 1);
        const x = (layerT - 0.5) * radius * 1.55 + (hash1(index * 3.13 + 5.0) - 0.5) * radius * (0.08 + 0.20 * spreadNorm + 0.12 * spreadExtra);
        const yBase = (ratios[rIndex] - 1.25) * radius * 0.36;
        const yWave = Math.sin(x / Math.max(radius, 1) * Math.PI * ratios[rIndex] * 2.0 + phase * 0.34 + rIndex) * radius * 0.12 * spreadNorm;
        const y = yBase + yWave + (hash1(index * 6.01 + 9.0) - 0.5) * radius * (0.22 * spreadNorm + 0.16 * spreadExtra);
        return { x, y, family: rIndex, id: index };
      }

      // Concentric / orbital default: organic radial cloud.
      const ringBands = Math.max(3, Math.round(Math.sqrt(count) * 0.9));
      const band = index % ringBands;
      const layer = Math.floor(index / ringBands);
      const aBase = hash1(index * 4.13) * Math.PI * 2;
      const aWave = Math.sin(aBase * 2.0 + phase * 0.16 + layer * 0.41) * 0.28;
      const a = aBase + aWave;
      const t = count <= 1 ? 0 : layer / Math.max(1, Math.ceil(count / ringBands) - 1);
      const radialJitter = (hash1(index * 8.17 + 9.1) - 0.5) * 2;
      const cyclical = Math.sin(a * 3.0 + phase * 0.31 + band * 0.8) * 0.18;
      const rBase = radius * (0.10 + 0.90 * t);
      const r = rBase * (0.72 + 0.28 * spreadNorm) + radius * radialJitter * (0.30 * spreadNorm + 0.14 * spreadExtra) + radius * cyclical * (0.18 * spreadNorm + 0.10 * spreadExtra);
      return { x: Math.cos(a) * r, y: Math.sin(a) * r, family: band, id: index };
    }

    function vectorField(x, y, state, radius, phase, poles, mode) {
      const flowAmt = Math.max(0, readVal(state, "flow", 58) / 100);
      const warpNorm = clamp01(readVal(state, "warp", 42) / 100);
      const poleForce = clamp01(readVal(state, "pole_force", 52) / 100);
      const spreadAmt = Math.max(0, readVal(state, "spread", 44) / 100);

      const r = Math.sqrt(x * x + y * y) + 1e-6;
      const a = Math.atan2(y, x);

      let vx = 0;
      let vy = 0;

      if (mode === 1) {
        // Parallel / flow lines.
        vx = 1.0;
        vy = Math.sin(y / Math.max(radius,1) * Math.PI * 2.6 + phase * 0.42) * 1.15 * flowAmt;
        vy += Math.cos(x / Math.max(radius,1) * Math.PI * 1.9 - phase * 0.23) * 0.42 * warpNorm;

        const wave = Math.sin((x + y * 0.6) / Math.max(radius,1) * Math.PI * 2.2 + phase * 0.57);
        vx += wave * 0.18 * warpNorm;
        vy += Math.cos((x - y) / Math.max(radius,1) * Math.PI * 1.6 - phase * 0.31) * 0.24 * spreadAmt;
      }
      else if (mode === 2) {
        // Converging / wavy lines converging.
        const targets = [
          { x: Math.sin(phase * 0.24) * radius * 0.14, y: Math.cos(phase * 0.18) * radius * 0.10 },
          { x: Math.cos(phase * 0.17 + 2.1) * radius * 0.24, y: Math.sin(phase * 0.21 + 2.8) * radius * 0.18 }
        ];
        const dA = dist2(x, y, targets[0].x, targets[0].y);
        const dB = dist2(x, y, targets[1].x, targets[1].y);
        const target = dA < dB ? targets[0] : targets[1];
        const dx = target.x - x;
        const dy = target.y - y;
        const d = Math.sqrt(dx * dx + dy * dy) + 1e-6;

        vx = (dx / d);
        vy = (dy / d);

        // Flow above 100 adds an increasingly strong circulating component
        // around the convergence target instead of merely accelerating it.
        const flowExtra = Math.max(0, flowAmt - 0.35);
        const swirlSign = Math.sin(a * 2.0 + phase * 0.19) >= 0 ? 1 : -1;
        vx += (-dy / d) * flowExtra * 0.72 * swirlSign;
        vy += ( dx / d) * flowExtra * 0.72 * swirlSign;

        // Orthogonal ripple gives the converging lines a musical / wavy quality.
        const nx = -vy;
        const ny = vx;
        const wave = Math.sin(d / Math.max(radius,1) * Math.PI * 5.1 - phase * 0.51 + a * 2.0);
        vx += nx * wave * 0.54 * warpNorm;
        vy += ny * wave * 0.54 * warpNorm;
      }
      else if (mode === 3) {
        // Resonance field / harmonic relationships.
        vx = 1.0;
        const y1 = Math.sin(x / Math.max(radius,1) * Math.PI * 2.0 + phase * 0.41);
        const y2 = Math.sin(x / Math.max(radius,1) * Math.PI * 3.0 - phase * 0.27);
        const y3 = Math.cos(x / Math.max(radius,1) * Math.PI * 1.5 + phase * 0.18);
        vy = (y1 * 0.48 + y2 * 0.34 + y3 * 0.26) * (1.05 * flowAmt + 0.18);

        const cross = Math.sin(y / Math.max(radius,1) * Math.PI * 2.4 - phase * 0.22);
        vx += cross * 0.16 * warpNorm;
        vy += Math.cos((x + y) / Math.max(radius,1) * Math.PI * 1.8 + phase * 0.29) * 0.22 * warpNorm;
      }
      else {
        // Concentric / orbital default.
        vx = -y / r;
        vy =  x / r;

        const radialBias = Math.sin(a * 2.0 - phase * 0.47) * 0.42 + Math.cos(r / Math.max(radius, 1) * 5.2 + phase * 0.39) * 0.28;
        vx += (x / r) * radialBias * 0.95 * flowAmt;
        vy += (y / r) * radialBias * 0.95 * flowAmt;

        const wave1 = Math.sin(a * 3.0 + phase * 0.61 + r / Math.max(radius, 1) * 7.0);
        const wave2 = Math.cos(a * 5.0 - phase * 0.33 - r / Math.max(radius, 1) * 4.2);
        vx += Math.cos(a + Math.PI * 0.5) * wave1 * 0.9 * warpNorm;
        vy += Math.sin(a + Math.PI * 0.5) * wave1 * 0.9 * warpNorm;
        vx += Math.cos(a - Math.PI * 0.2) * wave2 * 0.45 * warpNorm;
        vy += Math.sin(a - Math.PI * 0.2) * wave2 * 0.45 * warpNorm;
      }

      // Localized pole forces.
      // Each pole now owns a smaller influence zone instead of all poles blending
      // into one broad deformation field. This makes individual centres readable.
      const poleGain = mode === 3 ? 1.15 : mode === 2 ? 1.35 : 1.25;
      for (let i = 0; i < poles.length; i++) {
        const p = poles[i];
        const dx = p.x - x;
        const dy = p.y - y;
        const d2 = dx * dx + dy * dy;

        const sigma = radius * (p.influence || 0.22);
        const cutoff = sigma * 3.25;
        if (d2 > cutoff * cutoff) continue;

        const d = Math.sqrt(d2) + 1e-6;
        const local = Math.exp(-d2 / (2 * sigma * sigma));

        // Radial attract / repel component.
        const radial = local * p.sign * poleGain * poleForce;
        vx += (dx / d) * radial;
        vy += (dy / d) * radial;

        // Small tangential component prevents each pole from looking like a
        // simple pinch and gives it its own curl / deformation signature.
        const tangent = local * 0.42 * poleForce * (i % 2 === 0 ? 1 : -1);
        vx += (-dy / d) * tangent;
        vy += ( dx / d) * tangent;
      }

      // Light domain wobble: enough to keep life in the motion.
      const wobble = Math.sin((x / Math.max(radius,1)) * 4.1 + phase * 0.23) * Math.cos((y / Math.max(radius,1)) * 3.3 - phase * 0.17);
      vx += wobble * 0.34 * spreadAmt;
      vy -= wobble * 0.30 * spreadAmt;

      const len = Math.sqrt(vx * vx + vy * vy) || 1;
      return { x: vx / len, y: vy / len };
    }

    function buildPath(emitter, state, radius, phase, stepCount, stepSize, rotAngle, poles, mode) {
      const pts = [];
      let x = emitter.x;
      let y = emitter.y;

      const warpNorm = clamp01(readVal(state, "warp", 42) / 100);
      const spreadAmtBase = Math.max(0, readVal(state, "spread", 44) / 100);
      const poleCount = getPoleCount(state);
      const poleCountT = (poleCount - 3) / 93;
      const spreadAmt = spreadAmtBase * (1.0 + poleCountT * 1.35);
      const id = emitter.id || 0;

      // Every line gets its own distortion frequency / phase.
      // This is deliberately applied to the line geometry itself, not only
      // to the field that decides where the line travels.
      const warpPhaseA = hash1(id * 4.17 + 1.1) * Math.PI * 2;
      const warpPhaseB = hash1(id * 7.31 + 3.7) * Math.PI * 2;
      const warpFreqA = 0.34 + hash1(id * 5.83 + 8.2) * 0.42;
      const warpFreqB = 0.72 + hash1(id * 9.11 + 2.4) * 0.58;

      // Independent dispersal vector per line. At high Spread the paths are
      // allowed to leave the common figure instead of remaining bundled.
      const disperseAngle = hash1(id * 11.71 + 6.9) * Math.PI * 2;
      const disperseBias = 0.45 + hash1(id * 13.37 + 4.4) * 0.75;
      const disperseX = Math.cos(disperseAngle);
      const disperseY = Math.sin(disperseAngle);

      for (let i = 0; i < stepCount; i++) {
        const v = vectorField(x, y, state, radius, phase + i * 0.013, poles, mode);

        const familyPhase = emitter.family * 0.73 + phase * 0.2;
        const stepMod = 0.85 + 0.3 * Math.sin(i * 0.31 + familyPhase);

        x += v.x * stepSize * stepMod;
        y += v.y * stepSize * stepMod;

        // Progressive per-line dispersion.
        // The quadratic growth keeps the beginning related to the system,
        // while the later part is increasingly free to peel away.
        const progress = stepCount <= 1 ? 0 : i / (stepCount - 1);
        const spreadGrowth = progress * progress;
        x += disperseX * stepSize * 0.30 * spreadAmt * disperseBias * spreadGrowth;
        y += disperseY * stepSize * 0.30 * spreadAmt * disperseBias * spreadGrowth;

        const d = Math.sqrt(x * x + y * y);

        // Containment is progressively relaxed as Spread rises.
        const contain = Math.max(0, 1 - spreadAmt * 0.72);

        if (mode === 0 && d > radius * 1.15 && contain > 0) {
          const pull = (d - radius * 1.15) / (radius * 0.18);
          x -= (x / d) * stepSize * 1.8 * pull * contain;
          y -= (y / d) * stepSize * 1.8 * pull * contain;
        } else if ((mode === 1 || mode === 3) && Math.abs(y) > radius * 1.02 && contain > 0) {
          const edgeKeep = 1 - 0.015 * contain;
          y *= edgeKeep;
        } else if (mode === 2 && d > radius * 1.22 && contain > 0) {
          const edgeKeep = 1 - 0.008 * contain;
          x *= edgeKeep;
          y *= edgeKeep;
        }

        // LOCAL WARP: displace each sampled point across the path normal.
        // Two waves with independent frequency/phase create visible distortion
        // within each line instead of just rearranging the whole field.
        const normalX = -v.y;
        const normalY =  v.x;

        const waveA = Math.sin(i * warpFreqA + warpPhaseA + phase * 0.31);
        const waveB = Math.sin(i * warpFreqB + warpPhaseB - phase * 0.19);
        const localWarp =
          (waveA * 0.72 + waveB * 0.28) *
          stepSize * 2.25 * warpNorm;

        const px = x + normalX * localWarp;
        const py = y + normalY * localWarp;

        const pr = rotateLocal(px, py, rotAngle);
        pts.push(pr);
      }

      return pts;
    }

    function drawPath(points, cx, cy, color, width, alpha) {
      if (!points || points.length < 2) return;

      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(cx + points[0].x, cy + points[0].y);

      for (let i = 1; i < points.length - 1; i++) {
        const mx = (points[i].x + points[i + 1].x) * 0.5;
        const my = (points[i].y + points[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(cx + points[i].x, cy + points[i].y, cx + mx, cy + my);
      }

      const last = points[points.length - 1];
      ctx.lineTo(cx + last.x, cy + last.y);
      ctx.stroke();
    }

    window.sketchDraw = function(state, hostContext) {
      const w = canvas.width;
      const h = canvas.height;
      if (w < 1 || h < 1) return;

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const cx = w * 0.5;
      const cy = h * 0.5;
      const minSide = Math.min(w, h);

      const mode = getMode(state);
      const density = Math.round(clamp(readVal(state, "density", 90), 6, 120));
      const scaleNorm = readVal(state, "scale", 100) / 100;
      const pathLengthNorm = clamp01(readVal(state, "path_length", 56) / 100);
      const spreadNorm = Math.max(0, readVal(state, "spread", 44) / 100);
      const accentNorm = clamp01(readVal(state, "accent", 18) / 100);
      const lineWidth = Math.max(0.1, readVal(state, "line_width", 1.2));
      const bpm = clamp(readVal(state, "motion_bpm", 76), 30, 180);
      const phase = readVal(state, "time", 0) * (bpm / 60) * Math.PI * 0.44;
      const lineColor = readVal(state, "line_color", "#e8ddc8");
      const accentColor = readVal(state, "accent_color", "#ec6b2d");
      const lineColorOpacity = indexColorOpacity(hostContext, "line_color");
      const accentColorOpacity = indexColorOpacity(hostContext, "accent_color");
      const rotAngle = 0;

      const radius = minSide * 0.37 * scaleNorm;
      const stepCount = Math.round(14 + pathLengthNorm * 56);
      const stepSize = radius * (0.015 + 0.018 * pathLengthNorm);

      const poles = getPoles(radius, phase, mode, state);
      const paths = [];

      for (let i = 0; i < density; i++) {
        const emitter = makeEmitter(i, density, radius, spreadNorm, phase, mode);
        const path = buildPath(emitter, state, radius, phase, stepCount, stepSize, rotAngle, poles, mode);
        paths.push(path);
      }

      for (let i = 0; i < paths.length; i++) {
        drawPath(paths[i], cx, cy, lineColor, lineWidth, 0.82 * lineColorOpacity);
      }

      for (let i = 0; i < paths.length; i++) {
        const h = hash1(i * 13.7 + 9.1);
        if (h < accentNorm) {
          drawPath(paths[i], cx, cy, accentColor, lineWidth * 1.38, accentColorOpacity);
        }
      }

      ctx.globalAlpha = 1;
    };
  </script>

  <script>
    (function localPreview() {
      if (window.parent !== window) return;

      const manifest = window.SKETCH_TOOL;
      const state = { time: 0 };

      for (const p of manifest.params) state[p.key] = p.default;
      for (const c of manifest.colors) state[c.key] = c.default;

      function fit() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const side = Math.max(96, Math.min(window.innerWidth, window.innerHeight) - 40);

        canvas.style.width = side + "px";
        canvas.style.height = side + "px";

        window.sketchResize(
          Math.max(1, Math.floor(side * dpr)),
          Math.max(1, Math.floor(side * dpr))
        );
      }

      fit();
      window.addEventListener("resize", fit);

      let last = performance.now();

      function tick(now) {
        state.time += Math.min(0.05, (now - last) / 1000);
        last = now;

        try {
          window.sketchDraw(state);
        } catch (err) {
          console.error("[sketch] draw threw:", err);
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
