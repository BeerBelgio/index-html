<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homer's Hair v1.0</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="sketch-canvas"></canvas>

  <script>
    window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "Homer's Hair v1.0",
  params: [
    { key: "system", label: "Base Curve", min: 0, max: 3, step: 1, default: 3 },
    { key: "repetitions", label: "Repetitions", min: 2, max: 100, step: 1, default: 24 },
    { key: "spacing", label: "Spacing", min: 0, max: 200, step: 1, default: 58 },
    { key: "displacement", label: "Displacement", min: 0, max: 200, step: 1, default: 54 },
    { key: "phase_offset", label: "Phase Offset", min: 0, max: 360, step: 1, default: 18 },
    { key: "scale_step", label: "Scale Step", min: -8, max: 8, step: 0.1, default: 0.8 },
    { key: "rotation_step", label: "Rotation Step", min: -30, max: 30, step: 0.1, default: 2.2 },
    { key: "curve_tension", label: "Curve Tension", min: 0, max: 400, step: 1, default: 168 },
    { key: "warp", label: "Warp", min: 0, max: 200, step: 1, default: 34 },
    { key: "propagation", label: "Propagation", min: 0, max: 200, step: 1, default: 70 },
    { key: "line_width", label: "Line Width", min: 0.5, max: 6, step: 0.1, default: 1.2 },
    { key: "motion_bpm", label: "Motion BPM", min: 0, max: 260, step: 1, default: 72 }
  ],
  colors: [
    { key: "line_color", label: "Line Color", default: "#E8DDC8" }
  ],
  audio: [
    "repetitions", "spacing", "displacement", "phase_offset",
    "scale_step", "rotation_step", "curve_tension", "warp",
    "propagation", "line_width"
  ]
};

    const canvas = document.getElementById("sketch-canvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function clamp01(v) { return clamp(v, 0, 1); }

    function readVal(obj, key, fallback) {
      return (obj &&
        Object.prototype.hasOwnProperty.call(obj, key) &&
        obj[key] !== undefined &&
        obj[key] !== null)
        ? obj[key]
        : fallback;
    }

    
function indexColorOpacity(hostContext, key){
  if (!hostContext || !hostContext.colorOpacity) return 1;
  const value = Number(hostContext.colorOpacity[key]);
  return Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : 1;
}

window.sketchResize = function(width, height) {
      width = Math.max(1, Math.floor(width));
      height = Math.max(1, Math.floor(height));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    function rotatePoint(x, y, a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return {
        x: x * c - y * s,
        y: x * s + y * c
      };
    }

    function cubicBezier(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const uu = u * u;
      const tt = t * t;
      const uuu = uu * u;
      const ttt = tt * t;
      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    function basePoint(system, t, radius, tensionNorm) {
      const tension = tensionNorm;
      const x = (t - 0.5) * radius * 2;

      if (system === 0) {
        // Arc: higher Curve Tension produces a deeper / stronger bend.
        const xn = t * 2 - 1;
        const arch = Math.sqrt(Math.max(0, 1 - xn * xn));
        return {
          x,
          y: -arch * radius * (0.16 + tension * 2.88)
        };
      }

      if (system === 1) {
        // Sine: higher Curve Tension increases amplitude.
        const amp = radius * (0.12 + tension * 2.48);
        return {
          x,
          y: Math.sin(t * Math.PI * 2) * amp
        };
      }

      if (system === 2) {
        // Cubic Bezier: opposing handles create a controlled S-curve.
        const bend = radius * (0.18 + tension * 3.28);
        return cubicBezier(
          { x: -radius, y: 0 },
          { x: -radius * 0.28, y: -bend },
          { x:  radius * 0.28, y:  bend },
          { x:  radius, y: 0 },
          t
        );
      }

      // Loop: full closed form. Higher Curve Tension increases radial lobing.
      const a = t * Math.PI * 2;
      const radial =
        1 +
        Math.sin(a * 3) * 0.64 * tension +
        Math.cos(a * 5) * 0.28 * tension;

      return {
        x: Math.cos(a) * radius * radial,
        y: Math.sin(a) * radius * radial
      };
    }

    function baseTangent(system, t, radius, tensionNorm) {
      const eps = 0.0015;
      const ta = system === 3 ? (t - eps + 1) % 1 : clamp(t - eps, 0, 1);
      const tb = system === 3 ? (t + eps) % 1 : clamp(t + eps, 0, 1);

      const a = basePoint(system, ta, radius, tensionNorm);
      const b = basePoint(system, tb, radius, tensionNorm);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;

      return { x: dx / d, y: dy / d };
    }

    function buildRepeatedCurve(index, count, state, radius, phaseTime, samples, cx, cy) {
      const system = Math.round(clamp(readVal(state, "system", 3), 0, 3));
      const spacingNorm = Math.max(0, readVal(state, "spacing", 58) / 100);
      const displacementNorm = Math.max(0, readVal(state, "displacement", 54) / 100);
      const phaseOffset = readVal(state, "phase_offset", 18) * Math.PI / 180;
      const scaleStep = readVal(state, "scale_step", 0.8) / 100;
      const rotationStep = readVal(state, "rotation_step", 2.2) * Math.PI / 180;
      const tensionNorm = clamp01(readVal(state, "curve_tension", 168) / 400);
      const warpNorm = Math.max(0, readVal(state, "warp", 34) / 100);
      const propagationNorm = Math.max(0, readVal(state, "propagation", 62) / 100) * 5.0;

      const centered = index - (count - 1) * 0.5;
      const rel = count <= 1 ? 0 : centered / Math.max(1, (count - 1) * 0.5);

      // Spacing defines the total family envelope, not an unbounded per-copy gap.
      const offsetX =
        rel * Math.min(canvas.width, canvas.height) * 0.38 * spacingNorm;

      const scaleFactor = Math.max(0.08, 1 + centered * scaleStep);
      const rotation = centered * rotationStep;

      // Propagation is a phase-offset / cascade control only.
      // It no longer multiplies the animation clock, so raising Propagation
      // changes how deformation travels across copies without increasing speed.
      const propagationPhase =
        rel * propagationNorm * Math.PI * 1.65 +
        centered * propagationNorm * 0.11;

      const localTime =
        phaseTime +
        centered * phaseOffset +
        propagationPhase;

      const pts = [];

      for (let i = 0; i < samples; i++) {
        let t = samples <= 1 ? 0 : i / (samples - 1);

        // For a loop, keep the final sample equal to the first.
        if (system === 3 && i === samples - 1) t = 0;

        const p = basePoint(system, t, radius, tensionNorm);
        const tangent = baseTangent(system, t, radius, tensionNorm);
        const nx = -tangent.y;
        const ny = tangent.x;

        // Primary transformation wave.
        const primary =
          Math.sin(
            t * Math.PI * 2.0 +
            localTime +
            centered * phaseOffset * 0.35
          );

        // Secondary warp uses a different frequency and propagates differently.
        const secondary =
          Math.sin(
            t * Math.PI * (5.0 + Math.abs(rel) * 3.0) -
            phaseTime * 0.42 -
            propagationPhase * 0.72 +
            centered * 0.71
          );

        const disp =
          primary * radius * 0.20 * displacementNorm +
          secondary * radius * 0.095 * warpNorm;

        let x = p.x + nx * disp;
        let y = p.y + ny * disp;

        x *= scaleFactor;
        y *= scaleFactor;

        const r = rotatePoint(x, y, rotation);

        // Small propagation-driven transverse drift keeps the family from behaving
        // like a set of rigidly copied layers.
        const transverse =
          Math.sin(
            phaseTime * 0.55 +
            propagationPhase +
            t * Math.PI * 2 +
            index * 0.17
          ) *
          radius * 0.055 * propagationNorm * rel;

        pts.push({
          x: cx + r.x + offsetX,
          y: cy + r.y + transverse
        });
      }

      return pts;
    }

    function drawCurve(points, color, width, alpha) {
      if (!points || points.length < 2) return;

      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.globalAlpha = 0.90 * alpha;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 1; i < points.length - 1; i++) {
        const mx = (points[i].x + points[i + 1].x) * 0.5;
        const my = (points[i].y + points[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
      }

      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
    }

    window.sketchDraw = function(state, hostContext) {
      const w = canvas.width;
      const h = canvas.height;
      if (w < 1 || h < 1) return;

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const count = Math.round(clamp(readVal(state, "repetitions", 24), 2, 100));
      const lineWidth = Math.max(0.1, readVal(state, "line_width", 1.2));
      const bpm = clamp(readVal(state, "motion_bpm", 72), 0, 260);
      const phaseTime = readVal(state, "time", 0) * (bpm / 60) * Math.PI * 0.78;
      const color = readVal(state, "line_color", "#e8ddc8");
      const lineColorOpacity = indexColorOpacity(hostContext, "line_color");

      const minSide = Math.min(w, h);
      const radius = minSide * 0.25;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const samples = 104;

      for (let i = 0; i < count; i++) {
        const pts = buildRepeatedCurve(i, count, state, radius, phaseTime, samples, cx, cy);
        drawCurve(pts, color, lineWidth, lineColorOpacity);
      }

      ctx.globalAlpha = 1;
    };
  </script>

  <script>
    (function localPreview() {
      if (window.parent !== window) return;

      const manifest = window.SKETCH_TOOL;
      const state = { time: 0 };

      for (const p of manifest.params) state[p.key] = p.default;
      for (const c of manifest.colors) state[c.key] = c.default;

      function fit() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const side = Math.max(96, Math.min(window.innerWidth, window.innerHeight) - 40);

        canvas.style.width = side + "px";
        canvas.style.height = side + "px";

        window.sketchResize(
          Math.max(1, Math.floor(side * dpr)),
          Math.max(1, Math.floor(side * dpr))
        );
      }

      fit();
      window.addEventListener("resize", fit);

      let last = performance.now();

      function tick(now) {
        state.time += Math.min(0.05, (now - last) / 1000);
        last = now;

        try {
          window.sketchDraw(state);
        } catch (err) {
          console.error("[sketch] draw threw:", err);
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
