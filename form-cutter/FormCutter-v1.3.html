<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FormCutter v1.3</title>
  <style>
    html, body { margin: 0; background: #111; overflow: hidden; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: transparent; }
  </style>
</head>
<body>
<canvas id="sketch-canvas"></canvas>
<script>
window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "FormCutter v1.3",
  params: [
    { key: "cut_mode",      label: "Cut Mode",      min: 0, max: 5,   step: 1, default: 0  },
    { key: "source",        label: "Source",        min: 0, max: 5,   step: 1, default: 0  },
    { key: "trigger",       label: "Trigger",       min: 0, max: 100, step: 1, default: 0  },
    { key: "scale",         label: "Scale",   min: 0, max: 100, step: 1, default: 75 },
    { key: "stroke_width",  label: "Stroke Width",  min: 0, max: 100, step: 1, default: 35 },
    { key: "cut_density",   label: "Cut Density",   min: 0, max: 100, step: 1, default: 58 },
    { key: "cut_size",      label: "Cut Size",      min: 0, max: 100, step: 1, default: 60 },
    { key: "displacement",  label: "Displacement",  min: 0, max: 100, step: 1, default: 74 },
    { key: "rotation",      label: "Rotation",      min: 0, max: 100, step: 1, default: 40 }
  ],
  colors: [
    { key: "main_color",   label: "Main Color",   default: "#f2eee6" },
    { key: "base_color",   label: "Base Color",   default: "#ec6b2d" }
  ],
  audio: [
      "cut_mode", "source", "trigger", "scale", "stroke_width", "cut_density", "cut_size",
      "displacement", "rotation"
    ]
};

const canvas = document.getElementById('sketch-canvas');
const ctx = canvas.getContext('2d', { alpha: true });
const src = document.createElement('canvas');
const sctx = src.getContext('2d', { alpha: true });

const toolDefaults = Object.create(null);
for (const item of window.SKETCH_TOOL.params.concat(window.SKETCH_TOOL.colors)) {
  toolDefaults[item.key] = item.default;
}
function readVal(obj, key, fallback){
  if (Object.prototype.hasOwnProperty.call(toolDefaults, key)) fallback = toolDefaults[key];
  const value = (obj && Object.prototype.hasOwnProperty.call(obj, key)) ? obj[key] : undefined;
  if (value === undefined || value === null) return fallback;
  if (typeof fallback === 'number') {
    if (typeof value !== 'number' && typeof value !== 'string') return fallback;
    if (typeof value === 'string' && value.trim() === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
  if (typeof fallback === 'string' && fallback.charAt(0) === '#') {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }
  return value;
}

let triggerArmed = true;
let hitIndex = 0;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function clamp01(v){ return clamp(v, 0, 1); }
function fract(v){ return v - Math.floor(v); }
function hash(n){ return fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453); }
function easeOut(t){ return 1 - Math.pow(1 - clamp01(t), 3); }
function hexToRgb(hex){
  const h = typeof hex === 'string' && hex.charAt(0) === '#' ? hex.slice(1) : '';
  if (h.length !== 6) return [255,255,255];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgba(rgb,a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
function drawSrc(dx, dy, alpha){
  ctx.globalAlpha = alpha;
  ctx.drawImage(src, dx, dy);
  ctx.globalAlpha = 1;
}
function clipRect(x,y,w,h,dx,dy,rot,alpha){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.translate(x + w*0.5, y + h*0.5);
  ctx.rotate(rot);
  ctx.translate(-x - w*0.5 + dx, -y - h*0.5 + dy);
  drawSrc(0,0,alpha);
  ctx.restore();
}
function clipWedge(cx, cy, radius, a0, a1, dx, dy, rot, scale, alpha){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, a0, a1);
  ctx.closePath();
  ctx.clip();
  ctx.translate(cx + dx, cy + dy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);
  drawSrc(0, 0, alpha);
  ctx.restore();
}
function drawSource(w, h, type, color, size, stroke){
  sctx.clearRect(0,0,w,h);
  const minSide = Math.min(w,h);
  const cx = w * 0.5;
  const cy = h * 0.5;
  const s = 0.18 + size * 0.78;
  const mw = w * s;
  const mh = h * s;
  const r = minSide * (0.10 + size * 0.34);
  const sw = minSide * (0.004 + stroke * 0.14);
  sctx.fillStyle = rgba(color,1);
  sctx.strokeStyle = rgba(color,1);
  sctx.lineCap = 'square';
  sctx.lineJoin = 'miter';
  if (type === 0) {
    sctx.beginPath();
    sctx.arc(cx, cy, r, 0, Math.PI * 2);
    sctx.fill();
  } else if (type === 1) {
    sctx.fillRect(cx - mw*0.5, cy - mh*0.5, mw, mh);
  } else if (type === 2) {
    sctx.lineWidth = sw;
    sctx.strokeRect(cx - mw*0.5, cy - mh*0.5, mw, mh);
  } else if (type === 3) {
    sctx.lineWidth = sw;
    sctx.beginPath();
    sctx.arc(cx, cy, r, 0, Math.PI * 2);
    sctx.stroke();
  } else if (type === 4) {
    const n = 3 + Math.floor(size * 9);
    const gap = mw / Math.max(1,n);
    const bw = Math.min(gap * 0.95, sw);
    for (let i = 0; i < n; i++) {
      const x = cx - mw*0.5 + i * gap + (gap-bw)*0.5;
      sctx.fillRect(x, cy - mh*0.5, bw, mh);
    }
  } else {
    const n = 3 + Math.floor(size * 9);
    const gap = mh / Math.max(1,n);
    const bh = Math.min(gap * 0.95, sw);
    for (let i = 0; i < n; i++) {
      const y = cy - mh*0.5 + i * gap + (gap-bh)*0.5;
      sctx.fillRect(cx - mw*0.5, y, mw, bh);
    }
  }
}

window.sketchResize = function(width, height){
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    src.width = width;
    src.height = height;
  }
};

window.sketchDraw = function(state){
  const w = canvas.width;
  const h = canvas.height;
  if (w < 1 || h < 1) return;
  ctx.clearRect(0,0,w,h);

  const trig = clamp01(readVal(state, 'trigger') / 100);
  if (triggerArmed && trig >= 0.18) {
    hitIndex += 1;
    triggerArmed = false;
  }
  if (trig <= 0.08) triggerArmed = true;

  const burst = easeOut(trig);
  const snap = burst * burst;

  const mode = clamp(Math.round(readVal(state, 'cut_mode')), 0, 5);
  const source = clamp(Math.round(readVal(state, 'source')), 0, 5);
  const size = clamp01(readVal(state, 'scale') / 100);
  const stroke = clamp01(readVal(state, 'stroke_width') / 100);
  const density = clamp01(readVal(state, 'cut_density') / 100);
  const cutSize = clamp01(readVal(state, 'cut_size') / 100);
  const displacement = clamp01(readVal(state, 'displacement') / 100);
  const rotAmt = clamp01(readVal(state, 'rotation') / 100);
  const main = hexToRgb(readVal(state, 'main_color'));
  const base = hexToRgb(readVal(state, 'base_color'));

  // Base/source figure always visible in the second chosen color.
  drawSource(w, h, source, base, size, stroke);
  drawSrc(0, 0, 1);

  // Main fragmented layer drawn in the first chosen color.
  drawSource(w, h, source, main, size, stroke);
  const minSide = Math.min(w,h);
  const seed = hitIndex * 31.717 + mode * 903.13 + source * 201.4;
  const shift = minSide * displacement * (0.005 + 0.60 * cutSize * snap);
  const rotMax = Math.PI * 2 * rotAmt * cutSize * snap;

  if (burst <= 0.001) {
    drawSrc(0, 0, 1);
    return;
  }

  if (mode === 0) {
    const bands = 3 + Math.floor(density * 44);
    const bh = h / bands;
    for (let i = 0; i < bands; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const dx = dir * shift * (0.20 + hash(seed+i*1.9) * 1.25);
      const dy = (hash(seed+i*3.7)-0.5) * shift * 0.10;
      const rot = (hash(seed+i*5.1)-0.5) * rotMax;
      clipRect(0, i*bh, w, bh+1, dx, dy, rot, 1);
    }
  } else if (mode === 1) {
    const bands = 3 + Math.floor(density * 44);
    const bw = w / bands;
    for (let i = 0; i < bands; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const dx = (hash(seed+i*3.7)-0.5) * shift * 0.10;
      const dy = dir * shift * (0.20 + hash(seed+i*1.9) * 1.25);
      const rot = (hash(seed+i*5.1)-0.5) * rotMax;
      clipRect(i*bw, 0, bw+1, h, dx, dy, rot, 1);
    }
  } else if (mode === 2) {
    const cols = 2 + Math.floor(density * 12);
    const rows = 2 + Math.floor(density * 12);
    const cw = w / cols;
    const ch = h / rows;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const id = y * cols + x + 1;
        const angle = hash(seed+id*4.7) * Math.PI * 2;
        const mag = shift * (0.15 + hash(seed+id*8.9) * 1.15);
        const rot = (hash(seed+id*2.8)-0.5) * rotMax * 1.35;
        clipRect(x*cw, y*ch, cw+1, ch+1, Math.cos(angle)*mag, Math.sin(angle)*mag, rot, 1);
      }
    }
  } else if (mode === 3) {
    const cols = 2 + Math.floor(density * 10);
    const rows = 2 + Math.floor(density * 10);
    const cw = w / cols;
    const ch = h / rows;
    const cx = w * 0.5;
    const cy = h * 0.5;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = (x + 0.5) * cw;
        const py = (y + 0.5) * ch;
        let vx = px - cx;
        let vy = py - cy;
        const l = Math.sqrt(vx*vx + vy*vy) || 1;
        vx /= l; vy /= l;
        const id = y * cols + x + 1;
        const mag = shift * (0.30 + hash(seed+id*6.3) * 1.20);
        const rot = (hash(seed+id*9.1)-0.5) * rotMax;
        clipRect(x*cw, y*ch, cw+1, ch+1, vx*mag, vy*mag, rot, 1);
      }
    }
  } else if (mode === 4) {
    const cx = w * 0.5;
    const cy = h * 0.5;
    const radius = Math.sqrt(w*w + h*h);
    const wedges = 6 + Math.floor(density * 28);
    const start = hash(seed) * Math.PI * 2;
    for (let i = 0; i < wedges; i++) {
      const a0 = start + (i / wedges) * Math.PI * 2;
      const a1 = start + ((i + 0.76) / wedges) * Math.PI * 2;
      const mag = shift * (0.18 + hash(seed+i*2.3) * 1.18);
      const dx = Math.cos(a0) * mag;
      const dy = Math.sin(a0) * mag;
      const rot = (hash(seed+i*7.9)-0.5) * rotMax * 1.2;
      const sc = 1 + cutSize * snap * 0.25 * hash(seed+i*3.1);
      clipWedge(cx, cy, radius, a0, a1, dx, dy, rot, sc, 1);
    }
  } else {
    const cx = w * 0.5;
    const cy = h * 0.5;
    const copies = 2 + Math.floor(density * 10);
    drawSrc(0,0,1);
    for (let i = 1; i <= copies; i++) {
      const k = i / copies;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.translate(cx, cy);
      ctx.rotate((k - 0.5) * rotMax * 2 + (hash(seed+i)-0.5) * snap * 0.18);
      ctx.scale(1 + k * cutSize * snap * 0.42, 1 + k * cutSize * snap * 0.42);
      ctx.translate(-cx + (hash(seed+i*2.5)-0.5) * shift * 0.35, -cy + (hash(seed+i*4.5)-0.5) * shift * 0.35);
      drawSrc(0,0,Math.max(0.14, 0.85 - k * 0.55));
      ctx.restore();
    }
  }
};
</script>
<script>
(function localPreview(){
  if (window.parent !== window) return;
  const manifest = window.SKETCH_TOOL;
  const state = { time: 0 };
  for (const p of manifest.params) state[p.key] = p.default;
  for (const c of manifest.colors) state[c.key] = c.default;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    window.sketchResize(
      Math.max(1, Math.floor(width * dpr)),
      Math.max(1, Math.floor(height * dpr))
    );
  }
  fit();
  window.addEventListener('resize', fit);
  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    state.time += dt;
    const beat = (state.time * 2) % 1;
    state.trigger = beat < 0.065 ? 100 * (1 - beat / 0.065) : 0;
    try { window.sketchDraw(state); } catch(e) { console.error('[sketch] draw threw:', e); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
