<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FormShift v1.7</title>
  <style>
    html, body { margin: 0; background: #111; overflow: hidden; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: transparent; }
  </style>
</head>
<body>
<canvas id="sketch-canvas"></canvas>
<script>
window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "FormShift v1.7",
  params: [
    { key: "scene",       label: "FX Type",             min: 0, max: 5,   step: 1, default: 0  },
    { key: "shape",       label: "Shape",               min: 0, max: 5,   step: 1, default: 0  },
    { key: "trigger",     label: "Trigger",             min: 0, max: 100, step: 1, default: 0  },
    { key: "impact",      label: "Impact",              min: 0, max: 100, step: 1, default: 70 },
    { key: "scale",       label: "Scale",               min: 0, max: 100, step: 1, default: 70 },
    { key: "stretch_x",   label: "Horizontal Stretch",  min: 0, max: 100, step: 1, default: 20 },
    { key: "stretch_y",   label: "Vertical Stretch",    min: 0, max: 100, step: 1, default: 0  },
    { key: "rotation",    label: "Rotation",            min: 0, max: 100, step: 1, default: 50 },
    { key: "split",       label: "Split",               min: 0, max: 100, step: 1, default: 62 },
    { key: "shutter",     label: "Shutter",             min: 0, max: 100, step: 1, default: 62 }
  ],
  colors: [
    { key: "shape_color",  label: "Shape Color",  default: "#f2eee6" },
    { key: "accent_color", label: "Accent Color", default: "#ec6b2d" }
  ],
  audio: [
      "scene", "shape", "trigger", "impact", "scale", "stretch_x", "stretch_y", "rotation",
      "split", "shutter"
    ]
};

const canvas = document.getElementById('sketch-canvas');
const ctx = canvas.getContext('2d', { alpha: true });
const sourceCanvas = document.createElement('canvas');
const sctx = sourceCanvas.getContext('2d', { alpha: true });

const toolDefaults = Object.create(null);
for (const item of window.SKETCH_TOOL.params.concat(window.SKETCH_TOOL.colors)) {
  toolDefaults[item.key] = item.default;
}
function readVal(obj, key, fallback){
  if (Object.prototype.hasOwnProperty.call(toolDefaults, key)) fallback = toolDefaults[key];
  const value = (obj && Object.prototype.hasOwnProperty.call(obj, key)) ? obj[key] : undefined;
  if (value === undefined || value === null) return fallback;
  if (typeof fallback === 'number') {
    if (typeof value !== 'number' && typeof value !== 'string') return fallback;
    if (typeof value === 'string' && value.trim() === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
  if (typeof fallback === 'string' && fallback.charAt(0) === '#') {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }
  return value;
}

let prevTrigger = 0;
let cutCounter = 0;

function clamp01(v){ return Math.max(0, Math.min(1, v)); }
function fract(v){ return v - Math.floor(v); }
function hash(n){ return fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453); }
function hexToRgb(hex){
  const h = typeof hex === 'string' && hex.charAt(0) === '#' ? hex.slice(1) : '';
  if (h.length !== 6) return [255,255,255];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgba(rgb,a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
function easeOutCubic(t){ return 1 - Math.pow(1 - clamp01(t), 3); }
function drawImageFull(target, dx, dy, alpha){
  target.globalAlpha = alpha;
  target.drawImage(sourceCanvas, dx, dy);
  target.globalAlpha = 1;
}
function clipRectDraw(x, y, ww, hh, dx, dy, alpha){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, ww, hh);
  ctx.clip();
  drawImageFull(ctx, dx, dy, alpha);
  ctx.restore();
}
function clipWedgeDraw(cx, cy, radius, a0, a1, dx, dy, rotate, scale, alpha){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, a0, a1);
  ctx.closePath();
  ctx.clip();
  ctx.translate(cx + dx, cy + dy);
  ctx.rotate(rotate);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);
  drawImageFull(ctx, 0, 0, alpha);
  ctx.restore();
}

function drawSourceShape(w, h, shape, rgb, scale, stretchX, stretchY, rot, cutIndex){
  sctx.clearRect(0, 0, w, h);
  const minSide = Math.min(w, h);
  const cx = w * 0.5, cy = h * 0.5;
  // Preserve the previous horizontal-stretch character, then allow
  // an independent vertical extension on top of it.
  const sx = scale * (1 + stretchX * 1.75);
  const syBase = scale * (1 - stretchX * 0.46);
  const sy = syBase * (1 + stretchY * 1.75);
  const r = minSide * 0.25;

  sctx.save();
  sctx.translate(cx, cy);
  sctx.rotate(rot);
  sctx.scale(sx, sy);
  sctx.fillStyle = rgba(rgb, 1);
  sctx.strokeStyle = rgba(rgb, 1);
  sctx.lineWidth = Math.max(2, minSide * 0.026 / Math.max(0.36, scale));
  sctx.lineCap = 'round';
  sctx.lineJoin = 'round';

  if (shape === 0) {
    sctx.beginPath();
    sctx.arc(0, 0, r, 0, Math.PI * 2);
    sctx.fill();
  } else if (shape === 1) {
    sctx.beginPath();
    sctx.arc(0, 0, r * 0.90, 0, Math.PI * 2);
    sctx.stroke();
    sctx.beginPath();
    sctx.arc(0, 0, r * 0.38, 0, Math.PI * 2);
    sctx.stroke();
  } else if (shape === 2) {
    sctx.fillRect(-r * 1.45, -r * 0.22, r * 2.90, r * 0.44);
  } else if (shape === 3) {
    const step = r * 0.34;
    const dot = r * 0.066;
    for (let yy = -3; yy <= 3; yy++) {
      for (let xx = -3; xx <= 3; xx++) {
        const k = 0.96 + 0.08 * hash(xx*31 + yy*17 + cutIndex*7.3);
        sctx.beginPath();
        sctx.arc(xx * step, yy * step, dot * k, 0, Math.PI * 2);
        sctx.fill();
      }
    }
  } else if (shape === 4) {
    sctx.strokeRect(-r * 1.10, -r * 1.10, r * 2.20, r * 2.20);
    sctx.strokeRect(-r * 0.55, -r * 0.55, r * 1.10, r * 1.10);
  } else {
    sctx.fillRect(-r * 1.18, -r * 0.13, r * 2.36, r * 0.26);
    sctx.fillRect(-r * 0.13, -r * 1.18, r * 0.26, r * 2.36);
  }
  sctx.restore();
}

window.sketchResize = function(width, height){
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    sourceCanvas.width = width;
    sourceCanvas.height = height;
  }
};

window.sketchDraw = function(state){
  const w = canvas.width, h = canvas.height;
  if (w < 1 || h < 1) return;
  ctx.clearRect(0, 0, w, h);

  const t = readVal(state, 'time', 0);

  // Trigger is now the direct FX envelope.
  // No internal decay: when the incoming trigger falls, the effect falls with it.
  const triggerNorm = clamp01(readVal(state, 'trigger') / 100);
  const rise = Math.max(0, triggerNorm - prevTrigger);
  const isNewHit = rise > 0.02;
  if (isNewHit) {
    cutCounter += 1;
  }
  prevTrigger = triggerNorm;

  const burst = easeOutCubic(triggerNorm);
  const snap = burst * burst;
  const cutIndex = cutCounter;
  const minSide = Math.min(w, h);

  const scene = Math.max(0, Math.min(5, Math.round(readVal(state, 'scene'))));
  const shape = Math.max(0, Math.min(5, Math.round(readVal(state, 'shape'))));
  const impact = readVal(state, 'impact') / 100;
  const scale = 0.18 + (readVal(state, 'scale') / 100) * 1.22;
  const stretchX = readVal(state, 'stretch_x') / 100;
  const stretchY = readVal(state, 'stretch_y') / 100;
  const rotationAmount = (readVal(state, 'rotation') - 50) / 50;
  const split = readVal(state, 'split') / 100;
  const shutter = readVal(state, 'shutter') / 100;
  const shapeRgb = hexToRgb(readVal(state, 'shape_color'));
  const accentRgb = hexToRgb(readVal(state, 'accent_color'));

  const baseRot = rotationAmount * Math.PI * 0.55;
  drawSourceShape(w, h, shape, shapeRgb, scale, stretchX, stretchY, baseRot, cutIndex);

  if (burst <= 0.0001) {
    drawImageFull(ctx, 0, 0, 1);
    return;
  }

  const shift = minSide * impact * split * (0.03 + 0.56 * snap);
  const micro = minSide * impact * snap * 0.012;
  const seed = cutIndex * 19.19;

  if (scene === 0) {
    const bands = Math.floor(4 + shutter * 42);
    const bandH = h / bands;
    for (let i = 0; i < bands; i++) {
      const sign = i % 2 === 0 ? 1 : -1;
      const r = hash(seed + i * 2.7) - 0.5;
      const dx = sign * shift * (0.22 + 1.14 * hash(seed + i * 4.1)) + r * micro * 8;
      const dy = (hash(seed + i * 6.3) - 0.5) * micro * 2;
      clipRectDraw(0, i * bandH, w, bandH + 1, dx, dy, 1);
    }
    if (snap > 0.04) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(accentRgb, 0.18 * snap);
      ctx.lineWidth = Math.max(1, minSide * 0.004 * shutter);
      for (let i = 0; i < bands; i += 2) {
        ctx.beginPath();
        ctx.moveTo(0, i * bandH);
        ctx.lineTo(w, i * bandH);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  } else if (scene === 1) {
    const cX = w * 0.5, cY = h * 0.5;
    const qx = shift * (0.80 + shutter * 0.95);
    const qy = shift * (0.55 + shutter * 0.62);
    clipRectDraw(0, 0, cX, cY, -qx, -qy, 1);
    clipRectDraw(cX, 0, cX, cY, qx, -qy, 1);
    clipRectDraw(0, cY, cX, cY, -qx, qy, 1);
    clipRectDraw(cX, cY, cX, cY, qx, qy, 1);
    if (snap > 0.08) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.18 * snap;
      ctx.drawImage(sourceCanvas, -qx * 0.30, 0);
      ctx.drawImage(sourceCanvas, qx * 0.30, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  } else if (scene === 2) {
    const cx = w * 0.5, cy = h * 0.5;
    const radius = Math.sqrt(w*w + h*h);
    const wedges = Math.floor(8 + shutter * 28);
    for (let i = 0; i < wedges; i++) {
      const a0 = (i / wedges) * Math.PI * 2 + hash(seed) * Math.PI * 0.22;
      const a1 = ((i + 0.72) / wedges) * Math.PI * 2 + hash(seed) * Math.PI * 0.22;
      const amt = shift * (0.18 + hash(seed + i * 3.1) * 1.05);
      const dx = Math.cos(a0) * amt;
      const dy = Math.sin(a0) * amt;
      const rot = (hash(seed + i*8.2)-0.5) * split * snap * 0.52;
      const sc = 1 + split * snap * 0.26 * hash(seed + i*6.4);
      clipWedgeDraw(cx, cy, radius, a0, a1, dx, dy, rot, sc, 0.92);
    }
  } else if (scene === 3) {
    const slots = Math.floor(4 + shutter * 36);
    const vertical = cutIndex % 2 === 0;
    if (vertical) {
      const slotW = w / slots;
      for (let i = 0; i < slots; i++) {
        const amp = shift * (0.36 + 1.0 * hash(seed + i * 14.2));
        clipRectDraw(i * slotW, 0, slotW + 1, h, 0, (i % 2 ? -1 : 1) * amp, 1);
      }
    } else {
      const slotH = h / slots;
      for (let i = 0; i < slots; i++) {
        const amp = shift * (0.36 + 1.0 * hash(seed + i * 14.2));
        clipRectDraw(0, i * slotH, w, slotH + 1, (i % 2 ? -1 : 1) * amp, 0, 1);
      }
    }
  } else if (scene === 4) {
    const cx = w * 0.5, cy = h * 0.5;
    const copies = 1 + Math.floor(shutter * 10);
    drawImageFull(ctx, 0, 0, 1);
    for (let i = copies; i >= 1; i--) {
      const k = i / Math.max(1, copies);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((k - 0.5) * rotationAmount * Math.PI * 0.9 * snap + (hash(seed+i)-0.5) * 0.18 * snap);
      ctx.scale(1 + k * split * 0.62 * snap, 1 + k * split * 0.62 * snap);
      ctx.translate(-cx + (hash(seed+i*2.5)-0.5) * shift * 0.32, -cy + (hash(seed+i*5.5)-0.5) * shift * 0.32);
      ctx.globalCompositeOperation = i % 2 === 0 ? 'lighter' : 'source-over';
      drawImageFull(ctx, 0, 0, (0.08 + (1 - k) * 0.35) * snap);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    const cx = w * 0.5, cy = h * 0.5;
    const copies = 4 + Math.floor(shutter * 18);
    const arc = Math.PI * (0.20 + 1.70 * split * snap);
    for (let i = 0; i < copies; i++) {
      const k = copies <= 1 ? 0 : i / (copies - 1);
      const a = -arc * 0.5 + arc * k + rotationAmount * Math.PI * 0.45;
      const rad = minSide * split * snap * (0.04 + 0.48 * shutter);
      ctx.save();
      ctx.translate(cx + Math.cos(a - Math.PI * 0.5) * rad, cy + Math.sin(a - Math.PI * 0.5) * rad);
      ctx.rotate(a * 0.55 * snap);
      ctx.scale(1 - 0.16 * snap + 0.36 * snap * Math.sin(k * Math.PI), 1 - 0.16 * snap + 0.36 * snap * Math.sin(k * Math.PI));
      ctx.translate(-cx, -cy);
      drawImageFull(ctx, 0, 0, 0.18 + 0.82 * Math.sin(k * Math.PI));
      ctx.restore();
    }
  }
};
</script>
<script>
(function localPreview(){
  if (window.parent !== window) return;
  const manifest = window.SKETCH_TOOL;
  const state = { time: 0 };
  for (const p of manifest.params) state[p.key] = p.default;
  for (const c of manifest.colors) state[c.key] = c.default;
  state.trigger = 0;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    window.sketchResize(
      Math.max(1, Math.floor(width * dpr)),
      Math.max(1, Math.floor(height * dpr))
    );
  }
  fit();
  window.addEventListener('resize', fit);
  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    state.time += dt;
    const beat = (state.time * 120 / 60) % 1;
    state.trigger = beat < 0.08 ? 100 * (1 - beat / 0.08) : 0;
    try { window.sketchDraw(state); } catch(e) { console.error('[sketch] draw threw:', e); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
