name: INDEX Playground WebGL2 Regression
on:
  workflow_dispatch:
  push:
    branches:
      - lab/playground-webgl2-gate-a-20261120
      - fix/playground-native-webgl2-no-demo-20261120
      - fix/tool-header-and-release-0.22.0-20261121
      - feat/playground-import-compatibility-preflight-20261125
      - fix/webgl2-imagebitmap-orientation-20261125
      - fix/playground-import-feedback-diagnostics-20261125
      - chore/release-0.22.1-20261125
      - feat/index-openmosh-integration-20261127

concurrency:
  group: index-webgl2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-a-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript parse and invariant checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/playground.js
          node --check assets/js/playground-webgl2-lab.js
          python - <<'PY'
          from pathlib import Path
          js = Path('assets/js/playground.js').read_text()
          lab = Path('assets/js/playground-webgl2-lab.js').read_text()
          assert "renderer')==='canvas2d'" in js
          assert "IndexWebGL2Lab.create" in js
          assert "loadWebGL2Demo" not in js
          assert "CHANNEL RELAY [GPU LAB]" not in js
          html = Path('playground.html').read_text()
          assert "pg-webgl2-entry" not in html
          assert "playground-webgl2-lab.js" in html
          assert 'id="pg-file"' in html
          assert "getContext('webgl2'" in lab
          assert '#version 300 es' in lab
          assert "Unsupported fragment-webgl1" in lab
          assert all(x in lab for x in ['uLower', 'uUpper', 'uOpacity', 'uBlend'])
          assert 'localStorage' not in lab and 'indexedDB' not in lab
          print('Static invariants PASS')
          PY
      - name: Release metadata and Tool header typography invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = "0.22.1"
          data = json.loads(Path("data/tools.json").read_text())
          assert data["project"]["releaseBuild"] == version, "Download All build mismatch"
          assert len(data["tools"]) == 20, "generator catalogue count changed"
          for page in ("index.html", "about.html", "tool.html", "playground.html"):
              html = Path(page).read_text()
              assert html.count('name="index-html-build" content="' + version + '"') == 1, page + " version mismatch"
          assert version in Path("README.md").read_text()
          assert "## [" + version + "]" in Path("CHANGELOG.md").read_text()
          assert version in Path("docs/ROADMAP.md").read_text()
          css = Path("assets/css/tool-page.css").read_text()
          def rule(selector):
              start = css.index(selector + " {") + len(selector + " {")
              return css[start:css.index("}", start)]
          link = rule(".tool-playground-link")
          label = rule(".tool-switcher-label")
          for declaration in ("font-family: inherit;", "font-size: 11px;",
                              "line-height: 1;", "font-weight: 800;",
                              "letter-spacing: .08em;"):
              assert declaration in link and declaration in label, declaration
          assert ".tool-switcher-label { display: none; }" in css, "mobile label rule missing"
          assert 'assets/css/tool-page.css?v=0220' in Path("tool.html").read_text(), "Tool CSS cache not invalidated"
          assert "pg-webgl2-entry" not in Path("playground.html").read_text(), "demo UI regression"
          print("Release 0.22.1 metadata and Tool desktop/mobile CSS invariants PASS")
          PY
      - name: Desktop Tool header computed typography and screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8769 --bind 127.0.0.1 > tool-header-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --window-size=1500,720 --virtual-time-budget=14000 --dump-dom "http://127.0.0.1:8769/tests/tool-header-typography.html" >tool-header-result.html 2>tool-header-stderr.txt
          grep -E 'TOTAL [0-9]+ PASS|data-result=' tool-header-result.html | tail -8
          grep -q 'data-result="PASS"' tool-header-result.html
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --window-size=1500,720 --virtual-time-budget=10000 --screenshot=tool-header-desktop.png "http://127.0.0.1:8769/tests/tool-header-typography.html" >/dev/null 2>tool-header-screenshot-stderr.txt
      - name: Chromium headless pixel-oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then browser=google-chrome
          elif command -v chromium >/dev/null; then browser=chromium
          else echo "Chromium not available on runner"; exit 2; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --virtual-time-budget=12000 --dump-dom "file://$GITHUB_WORKSPACE/tests/webgl2-gate-a.html" > gate-a-browser-result.html 2>gate-a-browser-stderr.txt
          sed -n '/<pre id="results"/,/TOTAL .*<\/pre>/p' gate-a-browser-result.html | head -45
          if ! grep -q 'data-result="PASS"' gate-a-browser-result.html; then
            echo 'Browser oracle FAIL or not completed'; exit 1
          fi
      - name: ImageBitmap orientation corner oracle
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --virtual-time-budget=15000 --dump-dom "file://$GITHUB_WORKSPACE/tests/webgl2-imagebitmap-orientation.html" >bitmap-orientation-result.html 2>bitmap-orientation-stderr.txt
          grep -E "PASS |FAIL |TOTAL " bitmap-orientation-result.html | tail -32
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --window-size=1000,620 --virtual-time-budget=15000 --screenshot=bitmap-orientation-screen.png "file://$GITHUB_WORKSPACE/tests/webgl2-imagebitmap-orientation.html" >/dev/null 2>&1
          grep -q 'data-result="PASS"' bitmap-orientation-result.html
      - name: Import capability matrix and non-destructive replacement
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/playground-import-preflight.js
          node --check assets/js/playground.js
          node tests/preflight-compatibility.mjs
          python3 -m http.server 8771 --bind 127.0.0.1 >import-compat-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          node tests/run-browser-smoke.mjs "http://127.0.0.1:8771/tests/playground-import-nondestructive.html" import-compat-result.html "$browser"
          grep -q 'data-result="PASS"' import-compat-result.html
      - name: Playground integration smoke (offline-capable local server)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >gate-a-http-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          node tests/run-browser-smoke.mjs "http://127.0.0.1:8765/tests/playground-gate-a-smoke.html" gate-a-app-smoke.html "$browser"
          grep -q 'data-result="PASS"' gate-a-app-smoke.html
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1250,1080 --virtual-time-budget=60000 --screenshot=gate-a-playground-integration.png "http://127.0.0.1:8765/tests/playground-gate-a-smoke.html" >/dev/null 2>gate-a-integration-screenshot-stderr.txt
      - name: Normal public Playground WebGL2 rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8767 --bind 127.0.0.1 > public-demo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=45000 --dump-dom "http://127.0.0.1:8767/tests/playground-public-webgl2-demo.html" >public-demo-result.html 2>public-demo-stderr.txt
          sed -n '/<pre id="results"/,/TOTAL .*<\/pre>/p' public-demo-result.html | head -50
          grep -q 'data-result="PASS"' public-demo-result.html
      - name: Local HTML FX import and two instances on normal Playground
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8768 --bind 127.0.0.1 > local-fx-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          node tests/run-browser-smoke.mjs "http://127.0.0.1:8768/tests/playground-webgl2-local-fx-smoke.html" local-fx-result.html "$browser"
          sed -n '/<pre id="results"/,/TOTAL .*<\/pre>/p' local-fx-result.html | head -45
          grep -q 'data-result="PASS"' local-fx-result.html
      - name: WebGL2 FX multipass and history oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 >gate-b-http-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:8766/tests/webgl2-gate-b.html" >gate-b-result.html 2>gate-b-stderr.txt
          sed -n '/<pre id="results"/,/TOTAL .*<\/pre>/p' gate-b-result.html | head -45
          grep -q 'data-result="PASS"' gate-b-result.html
      - name: OpenMosh integration candidate checks
        if: github.ref_name == 'feat/index-openmosh-integration-20261127'
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/js/index-*.js assets/js/home-page.js assets/js/tool-page.js; do node --check "$f"; done
          git fetch --no-tags --depth=2 origin 9d4f76e5974728eee17dbcc2040de2e51ec1cb9f
          node tests/index-fx-catalogue.mjs
          git fetch --no-tags --depth=1 origin refs/tags/0.22.1
          mkdir -p .index-baseline
          git archive FETCH_HEAD | tar -x -C .index-baseline
          python3 -m http.server 8772 --bind 127.0.0.1 >fx-integration-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          node tests/run-browser-smoke.mjs http://127.0.0.1:8772/tests/index-fx-integration.html fx-integration-result.html "$browser"
          node tests/run-browser-smoke.mjs http://127.0.0.1:8772/tests/index-generator-library-smoke.html generator-library-result.html "$browser"
          node tests/run-browser-smoke.mjs http://127.0.0.1:8772/tests/index-home-comparison.html home-comparison-result.html "$browser"
      - name: Capture browser screenshot (diagnostic)
        if: always()
        shell: bash
        run: |
          set +e
          if command -v google-chrome >/dev/null; then browser=google-chrome; else browser=chromium; fi
          "$browser" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --allow-file-access-from-files --window-size=1100,760 --virtual-time-budget=12000 --screenshot=gate-a-browser.png "file://$GITHUB_WORKSPACE/tests/webgl2-gate-a.html" >/dev/null 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-a-browser-fixture
          path: |
            gate-a-browser-result.html
            gate-a-browser-stderr.txt
            gate-a-browser.png
            import-compat-result.html
            import-compat-http.log
            bitmap-orientation-result.html
            bitmap-orientation-stderr.txt
            bitmap-orientation-screen.png
            tool-header-result.html
            tool-header-stderr.txt
            tool-header-desktop.png
            tool-header-http.log
            gate-a-app-smoke.html
            public-demo-result.html
            local-fx-result.html
            local-fx-stderr.txt
            local-fx-http.log
            public-demo-stderr.txt
            public-demo-http.log
            gate-a-playground-integration.png
            gate-a-app-stderr.txt
            gate-a-http-server.log
            gate-b-result.html
            gate-b-stderr.txt
            gate-b-http-server.log
            fx-integration-result.html
            generator-library-result.html
            home-comparison-result.html
            fx-integration-http.log
          retention-days: 14
