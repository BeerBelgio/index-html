<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scatter Front v1.5</title>
  <style>
    html, body { margin: 0; background: #111; overflow: hidden; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: transparent; }
  </style>
</head>
<body>
  <canvas id="sketch-canvas"></canvas>

  <script>
    window.SKETCH_TOOL = {
      schemaVersion: 1,
      name: "Scatter Front v1.5",
      params: [
        { key: "progress",        label: "Progress",       min: 0, max: 100, step: 1, default: 42  },
        { key: "direction",       label: "Direction",      min: 0, max: 9,   step: 1, default: 0   },
        { key: "amount",          label: "Amount",         min: 0, max: 100, step: 1, default: 70  },
        { key: "edge_width",      label: "Edge Width",     min: 0, max: 100, step: 1, default: 34  },
        { key: "scatter",         label: "Scatter",        min: 0, max: 200, step: 1, default: 95  },
        { key: "turbulence",      label: "Turbulence",     min: 0, max: 200, step: 1, default: 80  },
        { key: "motion_bpm",      label: "Motion BPM",     min: 30, max: 240, step: 1, default: 120 },
        { key: "trail",           label: "Trail",          min: 0, max: 100, step: 1, default: 30  },
        { key: "grain",           label: "Grain",          min: 0, max: 100, step: 1, default: 65  }
      ],
      colors: [
        { key: "particle_color", label: "Particle Color", default: "#f2eee6" },
        { key: "accent_color",   label: "Accent Color",   default: "#ec6b2d" }
      ],
      audio: [
      "progress", "direction", "amount", "edge_width", "scatter", "turbulence", "motion_bpm",
      "trail", "grain"
    ]
    };

    const canvas = document.getElementById("sketch-canvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function fract(v) { return v - Math.floor(v); }
    function hash(n) { return fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453); }
    function hexToRgb(hex) {
      const h = typeof hex === "string" && hex.charAt(0) === "#" ? hex.slice(1) : "";
      if (h.length !== 6) return [255, 255, 255];
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function rgba(rgb, a) { return "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + a + ")"; }
    const toolDefaults = Object.create(null);
for (const item of window.SKETCH_TOOL.params.concat(window.SKETCH_TOOL.colors)) {
  toolDefaults[item.key] = item.default;
}
function readVal(obj, key, fallback){
  if (Object.prototype.hasOwnProperty.call(toolDefaults, key)) fallback = toolDefaults[key];
  const value = (obj && Object.prototype.hasOwnProperty.call(obj, key)) ? obj[key] : undefined;
  if (value === undefined || value === null) return fallback;
  if (typeof fallback === 'number') {
    if (typeof value !== 'number' && typeof value !== 'string') return fallback;
    if (typeof value === 'string' && value.trim() === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
  if (typeof fallback === 'string' && fallback.charAt(0) === '#') {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }
  return value;
}
    function mixRgb(a, b, t) {
      const k = clamp01(t);
      return [
        Math.round(a[0] + (b[0] - a[0]) * k),
        Math.round(a[1] + (b[1] - a[1]) * k),
        Math.round(a[2] + (b[2] - a[2]) * k)
      ];
    }

    window.sketchResize = function(width, height) {
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    function metric(nx, ny, mode) {
      const dx = nx - 0.5;
      const dy = ny - 0.5;
      const radial = clamp01(Math.sqrt(dx * dx + dy * dy) / 0.7071);
      if (mode === 0) return nx;
      if (mode === 1) return 1 - nx;
      if (mode === 2) return ny;
      if (mode === 3) return 1 - ny;
      if (mode === 4) return radial;
      if (mode === 5) return 1 - radial;
      if (mode === 6) return (nx + ny) * 0.5;
      if (mode === 7) return (nx + (1 - ny)) * 0.5;
      if (mode === 8) return Math.abs(nx - 0.5) * 2;
      return Math.abs(ny - 0.5) * 2;
    }

    function directionVector(mode, nx, ny) {
      const dx = nx - 0.5;
      const dy = ny - 0.5;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      if (mode === 0) return [1, 0];
      if (mode === 1) return [-1, 0];
      if (mode === 2) return [0, 1];
      if (mode === 3) return [0, -1];
      if (mode === 4) return [dx / len, dy / len];
      if (mode === 5) return [-dx / len, -dy / len];
      if (mode === 6) return [0.707, 0.707];
      if (mode === 7) return [0.707, -0.707];
      if (mode === 8) return [dx >= 0 ? 1 : -1, 0];
      return [0, dy >= 0 ? 1 : -1];
    }

    window.sketchDraw = function(state) {
      const w = canvas.width;
      const h = canvas.height;
      if (w < 1 || h < 1) return;

      const t = readVal(state, 'time', 0) || 0;
      const minSide = Math.min(w, h);
      const progress = clamp01(readVal(state, "progress", 42) / 100);
      const direction = Math.max(0, Math.min(9, Math.round(readVal(state, "direction", 0))));
      const amount = clamp01(readVal(state, "amount", 70) / 100);
      const edgeWidth = 0.014 + (readVal(state, "edge_width", 34) / 100) * 0.48;
      const scatter = readVal(state, "scatter", 95) / 100;
      const turbulence = readVal(state, "turbulence", 80) / 200;
      const bpm = Math.max(30, readVal(state, "motion_bpm", 120));
      const trail = readVal(state, "trail", 30) / 100;
      const grain = readVal(state, "grain", 65) / 100;

      const particleRgb = hexToRgb(readVal(state, "particle_color", "#f2eee6"));
      const accentRgb = hexToRgb(readVal(state, "accent_color", "#ec6b2d"));

      // Reset drawing state explicitly each frame while preserving transparency.
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const maxCount = Math.floor(600 + 16600 * amount);
      const cols = Math.max(18, Math.floor(Math.sqrt(maxCount * (w / Math.max(h, 1)))));
      const rows = Math.max(18, Math.floor(maxCount / cols));
      const baseR = Math.max(0.32, minSide * 0.00308);
      const beats = t * (bpm / 60);
      const frontWidth = edgeWidth;
      const tailWidth = edgeWidth * (0.30 + 2.90 * trail + 1.65 * grain * trail);

      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let iy = 0; iy < rows; iy++) {
        for (let ix = 0; ix < cols; ix++) {
          const id = ix + iy * cols + 1;
          const jitterPos = 0.12 + 1.45 * grain;
          const jx = (hash(id * 1.37) - 0.5) * jitterPos;
          const jy = (hash(id * 2.19) - 0.5) * jitterPos;
          const nx = (ix + 0.5 + jx) / cols;
          const ny = (iy + 0.5 + jy) / rows;
          const m = metric(nx, ny, direction);
          const grainWarp = (hash(id * 11.73) - 0.5) * grain * edgeWidth * 2.40;
          const dist = m - progress + grainWarp;

          let alpha = 0;
          let front = 0;
          let dust = 0;

          if (dist >= 0 && dist <= frontWidth) {
            front = 1 - dist / Math.max(frontWidth, 1e-4);
            alpha = 0.35 + 0.65 * front;
          } else if (dist < 0 && dist >= -tailWidth) {
            dust = 1 - Math.abs(dist) / Math.max(tailWidth, 1e-4);
            alpha = dust * (0.18 + 0.82 * trail);
          } else {
            continue;
          }

          const dir = directionVector(direction, nx, ny);
          const motionSpeed = 0.55 + bpm / 55;
          const swirlX = Math.sin(beats * (0.75 + 0.55 * hash(id * 3.7)) * motionSpeed + hash(id * 4.1) * 6.283);
          const swirlY = Math.cos(beats * (0.65 + 0.50 * hash(id * 5.3)) * motionSpeed + hash(id * 6.1) * 6.283);
          const active = Math.max(front, dust);
          const scatterPx = minSide * scatter * active * (0.010 + 0.260 * hash(id * 4.9)) * (1.00 + 1.30 * grain);
          const turbPx = minSide * turbulence * active * (0.014 + 0.120 * hash(id * 7.2)) * (1.00 + 1.55 * grain);

          const x = nx * w + dir[0] * scatterPx + swirlX * turbPx;
          const y = ny * h + dir[1] * scatterPx + swirlY * turbPx;

          const grainAlpha = 0.925 + 0.15 * hash(id * 8.7);
          const grainPulse = 1.00 + grain * 0.35 * (hash(id * 12.4) - 0.5);
          const localAlpha = clamp01(alpha * grainAlpha * grainPulse);
          const colorMix = clamp01(front * 0.58 + grain * 0.95 * hash(id * 6.13));
          const rgb = mixRgb(particleRgb, accentRgb, colorMix);
          const r = baseR * (0.975 + 0.05 * hash(id * 9.3));

          ctx.fillStyle = rgba(rgb, localAlpha);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    };
  </script>

  <script>
    (function localPreview() {
      if (window.parent !== window) return;

      const manifest = window.SKETCH_TOOL;
      const state = { time: 0 };
      for (const p of manifest.params) state[p.key] = p.default;
      for (const c of manifest.colors) state[c.key] = c.default;

      function fit() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, window.innerWidth);
        const height = Math.max(1, window.innerHeight);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        window.sketchResize(
          Math.max(1, Math.floor(width * dpr)),
          Math.max(1, Math.floor(height * dpr))
        );
      }
      fit();
      window.addEventListener("resize", fit);

      let last = performance.now();
      function tick(now) {
        state.time += Math.min(0.05, (now - last) / 1000);
        last = now;
        state.progress = 50 + 50 * Math.sin(state.time * 0.22);
        try { window.sketchDraw(state); } catch (err) { console.error("[sketch] draw threw:", err); }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
