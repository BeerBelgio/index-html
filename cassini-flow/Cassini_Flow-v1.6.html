<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cassini Flow v1.6</title>
  <style>
    html, body { margin: 0; background: #111; overflow: hidden; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: transparent; }
  </style>
</head>
<body>
<canvas id="sketch-canvas"></canvas>
<script>
window.SKETCH_TOOL = {
  schemaVersion: 1,
  name: "Cassini Flow v1.6",
  params: [
    { key: "mode",           label: "Mode",           min: 0,   max: 5,   step: 1, default: 0  },
    { key: "seed",           label: "Seed",           min: 0,   max: 100, step: 1, default: 17 },
    { key: "core_separation", label: "Core Separation", min: 0,   max: 100, step: 1, default: 58 },
    { key: "slices",         label: "Slices",         min: 2,   max: 36,  step: 1, default: 14 },
    { key: "scale",          label: "Scale",          min: 0,   max: 100, step: 1, default: 46 },
    { key: "warp",           label: "Warp",           min: 0,   max: 100, step: 1, default: 22 },
    { key: "drift",          label: "Drift",          min: 0,   max: 100, step: 1, default: 25 },
    { key: "slice_width",    label: "Slice Width",    min: 5,   max: 100, step: 1, default: 62 },
    { key: "accent",         label: "Accent",         min: 0,   max: 100, step: 1, default: 32 },
    { key: "rotation",       label: "Rotation",       min: 0,   max: 360, step: 1, default: 0  },
  ],
  colors: [
    { key: "slice_color",  label: "Slice Color",  default: "#E8DDC8" },
    { key: "accent_color", label: "Accent Color", default: "#6A9E5D" },
  ],
  audio: [
      "mode", "seed", "core_separation", "slices", "scale", "warp", "drift", "slice_width",
      "accent", "rotation"
    ]
};

const canvas = document.getElementById('sketch-canvas');
const ctx = canvas.getContext('2d', { alpha: true });

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function clamp01(v){ return clamp(v, 0, 1); }
function lerp(a, b, t){ return a + (b - a) * t; }
function fract(v){ return v - Math.floor(v); }

// The manifest is the single source of defaults for Sketch and local preview.
const toolDefaults = Object.create(null);
for (const item of window.SKETCH_TOOL.params.concat(window.SKETCH_TOOL.colors)) {
  toolDefaults[item.key] = item.default;
}
function readVal(obj, key, fallback){
  if (Object.prototype.hasOwnProperty.call(toolDefaults, key)) fallback = toolDefaults[key];
  const value = (obj && Object.prototype.hasOwnProperty.call(obj, key)) ? obj[key] : undefined;
  if (value === undefined || value === null) return fallback;
  if (typeof fallback === 'number') {
    if (typeof value !== 'number' && typeof value !== 'string') return fallback;
    if (typeof value === 'string' && value.trim() === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }
  if (typeof fallback === 'string' && fallback.charAt(0) === '#') {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
  }
  return value;
}

// Integrate speed over Sketch time: changing Drift never repositions the field.
// Constant-size state, no independent clock, smoothing or envelope.
let driftPhase = 0;
let previousTime = null;
let previousDrift = 0;
function advanceDrift(time, drift){
  if (previousTime === null || time < previousTime) {
    // A first frame or backward seek starts a new deterministic segment.
    // Historical automation before that time is not supplied by the host.
    driftPhase = time * drift * 3.2;
  } else if (time > previousTime) {
    driftPhase += (time - previousTime) * (previousDrift + drift) * 0.5 * 3.2;
  }
  previousTime = time;
  previousDrift = drift;
  return driftPhase;
}
function hash01(n){ return fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453123); }
function hexToRgb(hex){
  const h = typeof hex === 'string' && hex.charAt(0) === '#' ? hex.slice(1) : '';
  if (h.length !== 6) return [255,255,255];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgba(rgb,a){ return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

function cassiniValue(nx, ny, mode, seed, fscale, coreNorm, warpNorm, driftTime) {
  let x = (nx - 0.5) * fscale;
  let y = (ny - 0.5) * fscale;
  const s = seed * 0.173;
  const tt = driftTime;

  if (mode === 1) {
    y *= 1.42;
  } else if (mode === 2) {
    x *= 0.78;
    y *= 1.12;
  } else if (mode === 3) {
    x += Math.sin(y * 1.25 + s + tt * 0.45) * 0.24;
  } else if (mode === 4) {
    y += Math.sin(x * 1.15 - s + tt * 0.38) * 0.28;
  } else if (mode === 5) {
    const r = Math.sqrt(x*x + y*y) || 1e-4;
    const a = Math.atan2(y, x);
    const k = 1.0 + 0.18 * Math.sin(a * 5.0 + s + tt * 0.35);
    x *= k;
    y *= k;
  }

  const warp = warpNorm * 0.38;
  if (warp > 0.0001) {
    x += warp * (
      0.55 * Math.sin(y * 2.35 + s + tt * 0.60) +
      0.24 * Math.sin((x + y) * 3.10 - s * 0.7 - tt * 0.42)
    );
    y += warp * (
      0.55 * Math.cos(x * 2.05 - s * 0.8 - tt * 0.51) +
      0.24 * Math.cos((x - y) * 2.80 + s * 1.2 + tt * 0.33)
    );
  }

  const dBase = lerp(0.10, 1.28, coreNorm);
  const dPulse = 0.10 * warpNorm * Math.sin(tt * 0.55 + s);
  const d = Math.max(0.025, dBase + dPulse);
  let ax = -d;
  let ay = 0;
  let bx = d;
  let by = 0;

  if (mode === 2) {
    ay = -d * 0.36;
    by = d * 0.36;
  } else if (mode === 4) {
    ax = 0;
    bx = 0;
    ay = -d;
    by = d;
  } else if (mode === 5) {
    ax = -d * 0.84;
    bx = d * 0.84;
    ay = Math.sin(tt * 0.25 + s) * d * 0.20;
    by = -ay;
  }

  const r1 = Math.sqrt((x - ax)*(x - ax) + (y - ay)*(y - ay));
  const r2 = Math.sqrt((x - bx)*(x - bx) + (y - by)*(y - by));
  let v = Math.sqrt(Math.max(0, r1 * r2));

  if (mode === 3 || mode === 5) {
    const a = Math.atan2(y, x);
    v += warpNorm * 0.11 * Math.sin(a * 6.0 + s + tt * 0.31);
  }
  return v;
}

function levelAt(i, slices, coreNorm, scaleNorm) {
  const t = i / Math.max(1, slices);
  const minLevel = lerp(0.035, 0.17, coreNorm * 0.6);
  const maxLevel = lerp(1.10, 3.10, scaleNorm * 0.55 + 0.45);
  const curve = Math.pow(t, lerp(1.65, 0.76, coreNorm));
  return lerp(minLevel, maxLevel, curve);
}

function clipPoly(poly, threshold, keepAbove) {
  if (!poly.length) return [];
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const b = poly[(i + 1) % poly.length];
    const ain = keepAbove ? a.v >= threshold : a.v <= threshold;
    const bin = keepAbove ? b.v >= threshold : b.v <= threshold;

    if (ain && bin) {
      out.push(b);
    } else if (ain && !bin) {
      const t = (threshold - a.v) / ((b.v - a.v) || 1e-6);
      out.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), v: threshold });
    } else if (!ain && bin) {
      const t = (threshold - a.v) / ((b.v - a.v) || 1e-6);
      out.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), v: threshold });
      out.push(b);
    }
  }
  return out;
}

function appendPoly(poly) {
  if (poly.length < 3) return;
  ctx.moveTo(poly[0].x, poly[0].y);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.closePath();
}

function accentRanks(slices, seed) {
  const items = [];
  for (let i = 0; i < slices; i++) items.push({ i, k: hash01(seed * 23.71 + (i + 1) * 11.93) });
  items.sort((a, b) => a.k - b.k);
  const rank = new Array(slices);
  for (let r = 0; r < items.length; r++) rank[items[r].i] = r;
  return rank;
}

window.sketchResize = function(width, height){
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
};

window.sketchDraw = function(state){
  const w = canvas.width;
  const h = canvas.height;
  if (w < 2 || h < 2) return;
  ctx.clearRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;


  const mode = Math.round(clamp(readVal(state, 'mode'), 0, 5));
  const seed = readVal(state, 'seed');
  const coreNorm = clamp01(readVal(state, 'core_separation') / 100);
  const slices = Math.round(clamp(readVal(state, 'slices'), 2, 36));
  const scaleNorm = clamp01(readVal(state, 'scale') / 100);
  const warpNorm = clamp01(readVal(state, 'warp') / 100);
  const drift = clamp01(readVal(state, 'drift') / 100);
  const sliceWidth = clamp(readVal(state, 'slice_width'), 5, 100) / 100;
  const accentNorm = clamp01(readVal(state, 'accent') / 100);
  const rotation = readVal(state, 'rotation') * Math.PI / 180;

  const sliceRgb = hexToRgb(readVal(state, 'slice_color'));
  const accentRgb = hexToRgb(readVal(state, 'accent_color'));

  const minSide = Math.min(w,h);
  const aspect = w / Math.max(h, 1);
  const target = Math.round(lerp(88, 198, scaleNorm * 0.22 + warpNorm * 0.43 + slices / 80));
  const cols = Math.max(72, Math.min(240, Math.floor(target * Math.sqrt(aspect))));
  const rows = Math.max(72, Math.min(240, Math.floor(target / Math.sqrt(aspect))));
  const dx = w / cols;
  const dy = h / rows;
  const fscale = lerp(1.35, 6.85, scaleNorm);
  const driftTime = advanceDrift(Math.max(0, readVal(state, 'time', 0)), drift);
  const seamWidth = Math.max(0.55, Math.min(dx, dy) * 0.18);

  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);
  const vals = new Float32Array((cols + 1) * (rows + 1));

  for (let y = 0; y <= rows; y++) {
    const ny0 = y / rows;
    for (let x = 0; x <= cols; x++) {
      const nx0 = x / cols;
      const px = nx0 - 0.5;
      const py = ny0 - 0.5;
      const rx = px * cosR - py * sinR + 0.5;
      const ry = px * sinR + py * cosR + 0.5;
      vals[y * (cols + 1) + x] = cassiniValue(rx, ry, mode, seed, fscale, coreNorm, warpNorm, driftTime);
    }
  }

  const ranks = accentRanks(slices, seed);
  const accentCount = Math.floor(accentNorm * slices + 0.00001);

  for (let li = slices - 1; li >= 0; li--) {
    const low = levelAt(li, slices, coreNorm, scaleNorm);
    const next = levelAt(li + 1, slices, coreNorm, scaleNorm);
    const high = lerp(low, next, sliceWidth);
    const isAccent = accentCount > 0 && ranks[li] < accentCount;
    const rgb = isAccent ? accentRgb : sliceRgb;

    ctx.fillStyle = rgba(rgb, 1);
    ctx.strokeStyle = rgba(rgb, 1);
    ctx.lineWidth = seamWidth;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();

    for (let y = 0; y < rows; y++) {
      const y0 = y * dy;
      const y1 = (y + 1) * dy;
      for (let x = 0; x < cols; x++) {
        const x0 = x * dx;
        const x1 = (x + 1) * dx;
        const idx = y * (cols + 1) + x;
        const v0 = vals[idx];
        const v1 = vals[idx + 1];
        const v2 = vals[idx + cols + 2];
        const v3 = vals[idx + cols + 1];
        const minV = Math.min(v0, v1, v2, v3);
        const maxV = Math.max(v0, v1, v2, v3);
        if (high < minV || low > maxV) continue;

        const basePoly = [
          { x: x0, y: y0, v: v0 },
          { x: x1, y: y0, v: v1 },
          { x: x1, y: y1, v: v2 },
          { x: x0, y: y1, v: v3 }
        ];
        let poly = clipPoly(basePoly, low, true);
        poly = clipPoly(poly, high, false);
        appendPoly(poly);
      }
    }
    ctx.fill();
    ctx.stroke();
  }

  // Accent is applied only to the filled slices.
  // No extra central dots are drawn, so low accent values do not create undeformed points.
};
</script>
<script>
(function localPreview(){
  if (window.parent !== window) return;
  const manifest = window.SKETCH_TOOL;
  const state = { time: 0 };
  for (const p of manifest.params) state[p.key] = p.default;
  for (const c of manifest.colors) state[c.key] = c.default;

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    window.sketchResize(
      Math.max(1, Math.floor(width * dpr)),
      Math.max(1, Math.floor(height * dpr))
    );
  }
  fit();
  window.addEventListener('resize', fit);

  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    state.time += dt;
    try { window.sketchDraw(state); } catch(e) { console.error('[sketch] draw threw:', e); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
